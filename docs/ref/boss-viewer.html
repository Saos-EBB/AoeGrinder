<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frost Grind – Boss-Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Eine dunkle Spielwelt: Liste links, Arena Mitte, Boss-Akte rechts. Stufenfarben = WoW-Seltenheiten. */
  --bg:#0e0c10; --panel:#17141a; --line:#2b2530; --text:#ece6da; --muted:#9b919c; --accent:#ff6a3d;
  --t-frueh:#1eff00; --t-mittel:#3d9bff; --t-spaet:#b558f5; --t-final:#ff8000;
  --display:"Cinzel", "Trajan Pro", Georgia, serif; --body:"IBM Plex Sans", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--body);display:grid;grid-template-columns:260px 1fr 340px;overflow:hidden}
aside,section.info{background:var(--panel);overflow-y:auto}
aside{border-right:1px solid var(--line);padding:14px 10px 24px}
section.info{border-left:1px solid var(--line);padding:18px 18px 28px;display:flex;flex-direction:column;gap:14px}
h1{font:700 17px var(--display);letter-spacing:.04em;margin:0 6px 10px}
h2{font:700 24px/1.15 var(--display);margin:0;text-wrap:balance}
h3{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.tier{margin:14px 0 4px;padding:0 6px;display:flex;align-items:center;gap:8px;font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase}
.tier i{width:8px;height:8px;border-radius:2px;display:inline-block}
.list{display:flex;flex-direction:column;gap:1px}
.list button{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:6px 8px;border-radius:5px;color:var(--text)}
.list button small{color:var(--muted);font-variant-numeric:tabular-nums;min-width:22px}
.list button:hover{background:#221d26}
.list button.on{background:#2a2330;box-shadow:inset 3px 0 0 var(--c)}
.list button:focus-visible,.act:focus-visible,.row button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{position:relative;min-width:0}
canvas{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ft{position:absolute;left:0;top:0;font:700 15px var(--body);white-space:nowrap;text-shadow:0 2px 6px #000,0 0 2px #000}
.ft.hit{color:#ff4d4d;font-size:18px}.ft.ok{color:#5ff0ff}.ft.info{color:#f2eadb}.ft.heal{color:#58ff7a}.ft.big{color:#ffb347;font:700 26px var(--display)}
#bossbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(520px,80%);text-align:center;pointer-events:none}
#bossbar b{font:700 18px var(--display);letter-spacing:.05em;text-shadow:0 2px 6px #000}
.bar{height:12px;background:#000a;border:1px solid #5a4a4a;border-radius:3px;margin-top:4px;position:relative;overflow:hidden}
.bar span{position:absolute;inset:0 auto 0 0;background:linear-gradient(#d33,#811);transition:width .25s}
#pbar{position:absolute;left:16px;bottom:16px;width:220px;pointer-events:none;font-size:12px;color:var(--muted)}
#pbar .bar span{background:linear-gradient(#3c3,#171)}
#pbar .bar em{position:absolute;inset:0 0 0 auto;background:repeating-linear-gradient(45deg,#333 0 4px,#222 4px 8px);transition:width .25s}
#vign{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,#6a1aa8cc 100%);transition:opacity .3s}
#hint{position:absolute;right:14px;bottom:14px;font-size:12px;color:var(--muted);text-align:right;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--c);color:var(--c)}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.desc{margin:0;max-width:65ch}
.acts{display:flex;flex-direction:column;gap:6px}
.act{all:unset;cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:2px 8px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#1d1921}
.act:hover{border-color:#4a3f50;background:#231e28}
.act.run{border-color:var(--accent)}
.act kbd{grid-row:span 2;font:600 12px var(--body);color:var(--muted);border:1px solid var(--line);border-radius:4px;height:20px;display:grid;place-items:center}
.act strong{font-weight:600}
.act span{grid-column:2;color:var(--muted);font-size:12.5px}
.act.rule{background:#1a1a22}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row button{all:unset;cursor:pointer;padding:8px 12px;border-radius:6px;background:var(--accent);color:#1a0d08;font-weight:600}
.row button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
label{display:flex;gap:8px;align-items:center;color:var(--muted);cursor:pointer}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
@media (max-width:900px){
  body{grid-template-columns:1fr;grid-template-rows:auto 55vh auto;overflow:auto;height:auto}
  aside{max-height:30vh;border-right:0;border-bottom:1px solid var(--line)}
  main{height:55vh}
  section.info{border-left:0}
}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}

<body>
<aside><h1>Boss-Viewer</h1><div id="list"></div></aside>
<main>
  <canvas id="c"></canvas>
  <div id="vign"></div>
  <div id="overlay"></div>
  <div id="bossbar"><b id="bname"></b><div class="bar"><span id="bhp" style="width:100%"></span></div></div>
  <div id="pbar">Spieler<div class="bar"><span id="php" style="width:100%"></span><em id="pmax" style="width:0%"></em></div></div>

</main>
<section class="info" id="info"></section>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- Zeit / Tasks ---------- */
let tasks=[], timeScale=1;
function tween(dur, fn, done, always=false){ const t={el:0,dur:Math.max(dur,0.0001),fn,done,always}; tasks.push(t); return t; }
const tw=(d,fn,always)=>new Promise(r=>tween(d,fn,r,always));
const wait=s=>tw(s,null);
function tick(dt){
  for(let i=0;i<tasks.length;i++){
    const t=tasks[i]; t.el+=dt*(t.always?1:timeScale);
    const k=Math.min(1,t.el/t.dur); if(t.fn) t.fn(k);
    if(k>=1){ tasks.splice(i,1); i--; if(t.done) t.done(); }
  }
}
const ease=k=>1-Math.pow(1-k,3), easeIn=k=>k*k;

/* ---------- Szene ---------- */
const canvas=document.getElementById('c'), overlay=document.getElementById('overlay');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0e0c10); scene.fog=new THREE.Fog(0x0e0c10,45,95);
const camera=new THREE.PerspectiveCamera(48,1,0.1,200); camera.position.set(11,10.5,19);
const controls=new OrbitControls(camera,canvas); controls.target.set(0,2,1); controls.enableDamping=true; controls.maxPolarAngle=1.45; controls.minDistance=8; controls.maxDistance=70;
scene.add(new THREE.HemisphereLight(0xc4b8d8,0x1a1410,1.15));
const sun=new THREE.DirectionalLight(0xfff0dd,1.7); sun.position.set(8,14,6); scene.add(sun);
const rim=new THREE.DirectionalLight(0x6a7aff,.8); rim.position.set(-10,6,-12); scene.add(rim);
const world=new THREE.Group(); scene.add(world);
const fx=new THREE.Group(); world.add(fx);

const ground=new THREE.Mesh(new THREE.CircleGeometry(70,64).rotateX(-Math.PI/2), new THREE.MeshStandardMaterial({color:0x151217,roughness:1})); world.add(ground);
const floor=new THREE.Mesh(new THREE.CircleGeometry(20,64).rotateX(-Math.PI/2), new THREE.MeshStandardMaterial({color:0x221c25,roughness:1})); floor.position.y=.01; world.add(floor);
for(let i=1;i<4;i++){ const l=new THREE.Mesh(new THREE.RingGeometry(i*5-.04,i*5+.04,64).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({color:0x3a3140})); l.position.y=.015; world.add(l); }
const arenaRing=new THREE.Mesh(new THREE.TorusGeometry(20,.14,8,96).rotateX(Math.PI/2), new THREE.MeshBasicMaterial({color:0xff5a2a})); arenaRing.position.y=.1; world.add(arenaRing);
let arenaR=20; function setArena(r){ arenaR=r; arenaRing.scale.set(r/20,1,r/20); }

/* ---------- Bausteine Modelle ---------- */
const M=(c,e=0,ei=0,x={})=>new THREE.MeshStandardMaterial({color:c,emissive:e,emissiveIntensity:ei,roughness:.72,metalness:.12,flatShading:true,...x});
const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d), S=(r,a=10,b=8)=>new THREE.SphereGeometry(r,a,b), C=(rt,rb,h,s=8,o=false)=>new THREE.CylinderGeometry(rt,rb,h,s,1,o), K=(r,h,s=8)=>new THREE.ConeGeometry(r,h,s);
function put(par,geo,mat,x=0,y=0,z=0){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); par.add(m); return m; }

function weapon(type,ctx){
  const g=new THREE.Group(); const {metal,wood,glow}=ctx;
  switch(type){
    case 'club': put(g,C(.08,.24,1.4),wood,0,-.7,0); break;
    case 'sword': put(g,B(.07,1.5,.22),metal,0,-.95,0); put(g,B(.5,.08,.12),wood,0,-.2,0); break;
    case 'greatsword': put(g,B(.12,2.7,.48),metal,0,-1.55,0); put(g,B(.85,.1,.16),wood,0,-.2,0); break;
    case 'spear': put(g,C(.05,.05,3.2),wood,0,-1.0,0); { const t=put(g,K(.14,.6),metal,0,-2.85,0); t.rotation.x=Math.PI; } break;
    case 'hammer': put(g,C(.07,.07,1.9),wood,0,-.95,0); put(g,B(.9,.55,.55),metal,0,-1.9,0); break;
    case 'axe': put(g,C(.06,.06,1.8),wood,0,-.9,0); put(g,B(.09,.8,.7),metal,0,-1.55,.32); break;
    case 'katana': put(g,B(.05,1.35,.1),metal,0,-.85,0); put(g,C(.1,.1,.03,10),wood,0,-.15,0); break;
    case 'needle': put(g,C(.025,.06,1.8),metal,0,-.9,0); break;
    case 'hook': put(g,C(.05,.05,.5),wood,0,-.25,0); { const h=put(g,new THREE.TorusGeometry(.32,.06,6,14,Math.PI*1.3),metal,0,-.75,0); h.rotation.y=Math.PI/2; } break;
    case 'staff': put(g,C(.05,.06,2.3),wood,0,-1.1,0); put(g,S(.2),glow,0,-2.3,0); break;
    case 'mace': put(g,C(.06,.06,1.3),wood,0,-.65,0); put(g,S(.32,8,6),metal,0,-1.4,0); for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; const sp=put(g,K(.07,.28,4),metal,Math.cos(a)*.34,-1.4,Math.sin(a)*.34); sp.rotation.z=-Math.PI/2; sp.rotation.y=-a; } break;
    case 'curved': put(g,B(.12,1.6,.5),metal,0,-1.0,0); { const t=put(g,B(.12,1.3,.5),metal,0,-2.25,.28); t.rotation.x=.45; } put(g,B(.8,.1,.16),wood,0,-.2,0); break;
    case 'scythe': put(g,C(.05,.05,2.4),wood,0,-1.1,0); put(g,B(.06,.18,1.2),metal,0,-2.25,.55); break;
  }
  g.rotation.x = type==='staff' ? Math.PI*.92 : -0.9;
  return g;
}

function headOf(type,P,ctx){
  const h=new THREE.Group(); const {skin,armor,acc,eye,dark}=ctx; const eyes=(z=.27,y=0,sp=.11,r=.055)=>{ put(h,S(r,6,5),eye,-sp,y,z); put(h,S(r,6,5),eye,sp,y,z); };
  switch(type){
    case 'gnoll': { const s=put(h,S(.32),skin); s.scale.y=1.05; put(h,B(.24,.22,.42),skin,0,-.06,.32); put(h,S(.07,6,5),dark,0,-.02,.54); put(h,K(.09,.3),skin,-.2,.3,0); put(h,K(.09,.3),skin,.2,.3,0); eyes(.25,.06,.12); break; }
    case 'helm': put(h,B(.52,.58,.56),armor); put(h,B(.38,.06,.02),eye,0,.02,.29); break;
    case 'skull': put(h,S(.31),M(0xd8cfb4)); eyes(.25,.03,.11,.07); break;
    case 'crown': put(h,S(.3),skin); for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; put(h,K(.06,.24,5),M(0xd8b04a,0x4a3000,.4),Math.cos(a)*.24,.32,Math.sin(a)*.24); } eyes(); break;
    case 'horns': put(h,S(.31),skin); { const a=put(h,K(.09,.7),dark,-.24,.3,0); a.rotation.z=.7; const b=put(h,K(.09,.7),dark,.24,.3,0); b.rotation.z=-.7; } eyes(); break;
    case 'hood': put(h,K(.42,.85),armor,0,.1,-.02); put(h,S(.24),M(0x050407),0,-.02,.07); eyes(.27,0,.09); break;
    case 'lich': put(h,B(.52,.6,.56),armor); for(let i=-2;i<=2;i++) put(h,K(.06,.38,5),armor,i*.11,.45,0); put(h,B(.38,.07,.02),eye,0,.02,.29); break;
    case 'mask': { const s=put(h,S(.3),M(0xf2ede4)); s.scale.set(1,1.15,.9); put(h,S(.07,6,5),dark,-.11,0,.25); put(h,S(.07,6,5),dark,.11,0,.25); const a=put(h,K(.06,.55),M(0xf2ede4),-.14,.5,0); a.rotation.z=.25; const b=put(h,K(.06,.55),M(0xf2ede4),.14,.5,0); b.rotation.z=-.25; break; }
    case 'lion': put(h,B(.52,.58,.6),armor); put(h,B(.38,.06,.02),eye,0,.02,.31); { const p=put(h,K(.12,.6),acc,0,.5,-.1); p.rotation.x=-.5; } break;
    case 'demonQueen': put(h,S(.3),skin); eyes(); for(const s of [-1,1]){ const a=put(h,K(.08,.9),dark,s*.2,.35,-.25); a.rotation.x=-1.0; a.rotation.z=s*-.3; } for(let i=-1;i<=1;i++) put(h,K(.05,.25,4),acc,i*.12,.34,.05); break;
    case 'roundHelm': { const s=put(h,S(.46,12,10),armor); s.scale.y=.95; put(h,B(.5,.07,.05),eye,0,0,.42); break; }
    case 'weaver': { const s=put(h,S(.3),M(0xf2ede4)); s.scale.set(.85,1.25,.9); for(const [x,y] of [[-.1,.06],[.1,.06],[-.07,-.08],[.07,-.08]]) put(h,S(.045,6,5),dark,x,y,.25); for(const s2 of [-1,1]){ const a=put(h,C(.012,.012,.6,4),dark,s2*.1,.55,-.05); a.rotation.z=s2*-.35; } break; }
    case 'brain': put(h,S(.22),skin); eyes(.19,0,.08,.04); { const br=put(h,S(.5,12,10),ctx.glow,0,.48,0); br.scale.set(1.15,.8,1); for(let i=-1;i<=1;i++){ const r=put(h,new THREE.TorusGeometry(.42,.025,4,20,Math.PI),dark,0,.48,i*.15); r.rotation.y=Math.PI/2; } } break;
    case 'ashKing': put(h,S(.3),skin); eyes(); { const bd=put(h,K(.22,.5,6),M(0xc8c0b0),0,-.35,.12); bd.rotation.x=Math.PI; } for(let i=0;i<7;i++){ const a=i/7*Math.PI*2; put(h,K(.05,.12+((i*3)%4)*.06,4),M(0x7a6a3a),Math.cos(a)*.24,.32,Math.sin(a)*.24); } break;
    case 'iceCrown': put(h,B(.5,.56,.54),armor); put(h,B(.36,.06,.02),eye,0,.02,.28); { const im=M(0xbfe8ff,0x4ab0ff,.5); for(let i=-3;i<=3;i++){ const c=put(h,K(.06,.35+(3-Math.abs(i))*.12,4),im,i*.08,.42+(3-Math.abs(i))*.05,0); c.rotation.z=i*-.12; } } break;
    case 'mane': put(h,S(.3),skin); eyes(); { const mm=M(0xc8402a); for(let i=0;i<9;i++){ const a=i/9*Math.PI*2; put(h,S(.2,6,5),mm,Math.cos(a)*.33,.05+Math.sin(a)*.33,-.12); } put(h,S(.3,8,6),mm,0,.12,-.22); } break;
    case 'starHood': put(h,K(.44,.95),armor,0,.12,-.02); put(h,S(.25),M(0x05070f),0,-.02,.08); for(const [x,y,c] of [[-.08,.04,0xffffff],[.07,-.05,0x6ab0ff],[.02,.1,0xffffff],[-.03,-.1,0x6ab0ff],[.1,.08,0xffffff]]) put(h,S(.025,5,4),M(c,c,2),x,y,.31); break;
    case 'porcelain': { const s=put(h,S(.3),M(0xe8e0d0)); s.scale.set(.9,1.15,.9); put(h,B(.11,.035,.02),dark,-.1,.04,.27); put(h,B(.11,.035,.02),dark,.1,.04,.27); put(h,B(.13,.025,.02),dark,0,-.15,.27); eyes(.28,.03,.1,.03); put(h,K(.4,.55),armor,0,.34,-.06); break; }
    case 'candles': { put(h,S(.28),skin); eyes(.25,.02,.1,.045); put(h,new THREE.TorusGeometry(.26,.03,5,20).rotateX(Math.PI/2),M(0xd8b04a,0x3a2a00,.4),0,.26,0); for(let i=-2;i<=2;i++){ const z=-.02-Math.abs(i)*.04; put(h,C(.035,.035,.18+(2-Math.abs(i))*.06,6),M(0xe8dcc0),i*.1,.38+(2-Math.abs(i))*.03,z); put(h,K(.035,.1,5),ctx.glow,i*.1,.54+(2-Math.abs(i))*.06,z); } break; }
    default: put(h,S(.31),skin); eyes();
  }
  if(P.redHair){ const hr=put(h,K(.3,1.4,8),M(0xb8261a),0,-.55,-.2); hr.rotation.x=Math.PI-.15; }
  if(P.wildMane){ const wm=M(0x0e0c10); for(let i=0;i<11;i++){ const a=(i/10-.5)*Math.PI*1.4; const sp=put(h,K(.08,.55,4),wm,Math.sin(a)*.3,.15+Math.cos(a)*.2,-.18); sp.rotation.z=-a*.9; sp.rotation.x=-.5; } }
  if(P.flameCrown){ const fm=M(0xff7a2a,0xff4a00,1.4); for(let i=-2;i<=2;i++) put(h,K(.06,.3+(2-Math.abs(i))*.12,5),fm,i*.1,.42+(2-Math.abs(i))*.04,0); }
  if(P.tusks){ put(h,K(.05,.2),M(0xe8e0c8),-.1,-.18,.25); put(h,K(.05,.2),M(0xe8e0c8),.1,-.18,.25); }
  return h;
}

function ctxOf(P,ms){
  const mk=(c,e=0,i=0,x)=>{ const m=M(c,e,i,x); ms.push(m); return m; };
  const glowC=P.glow ?? P.eye ?? 0xffcc66;
  return { mk, skin:mk(P.skin??0x8a7a6a), armor:mk(P.armor??0x4a4a52,0,0,{side:THREE.DoubleSide}), acc:mk(P.accent??0x8a2a22,0,0,{side:THREE.DoubleSide}),
    eye:mk(P.eye??glowC,P.eye??glowC,2.2), glow:mk(glowC,glowC,1.4), dark:mk(0x1a1418),
    metal:P.weaponGlow? mk(P.weaponGlow,P.weaponGlow,.9): mk(P.metal??0xb8b8c0), wood:mk(P.wood??0x5a3a22) };
}

function biped(P,ms){
  const g=new THREE.Group(), x=ctxOf(P,ms), b=P.bulk??1, parts={};
  if(P.float){ const r=put(g,P.gown?K(1.2*b,2.0,12):K(.8*b,1.4,10),x.armor,0,P.gown?1.0:.95,0); r.material=x.armor; if(P.wisp){ r.rotation.x=Math.PI; r.scale.set(.7,1.3,.7); r.position.y=.6; } }
  else { for(const s of [-1,1]){ put(g,B(.32*b,1.0,.38),x.armor,s*.24*b,.5,0); put(g,B(.36*b,.16,.5),x.acc,s*.24*b,.08,.05); } }
  put(g,B(.8*b,.3,.45),x.armor,0,1.05,0);
  put(g,B(.95*b,.85,.55),x.armor,0,1.6,0);
  if(P.belly){ const bl=put(g,S(.68*b,12,10),x.skin,0,1.35,.18); bl.scale.set(1,.9,.95); }
  if(P.pauldrons!==false){ for(const s of [-1,1]){ const p=put(g,S(.28*b),x.acc,s*.6*b,2.0,0); p.scale.set(1.15,.7,1.15); } }

function makeBody(spec, pos){
  const ms=[]; const {g,parts,h}=BUILD[spec.t](spec.p,ms);
  const root=new THREE.Group(), pivot=new THREE.Group(), model=new THREE.Group();
  root.add(pivot); pivot.add(model); model.add(g); const sc=spec.p.scale??1.6; model.scale.setScalar(sc);
  root.position.copy(pos);
  const mats=ms.map(m=>({m,e:m.emissive.clone(),i:m.emissiveIntensity}));
  const body={root,pivot,model,parts,mats,h:h*sc,sc,float:!!spec.p.float||spec.t==='blob',spec,home:pos.clone(),grow:1,active:true};
  if(parts.lava){ g.remove(parts.lava); parts.lava.scale.setScalar(sc*.9); root.add(parts.lava); }
  return body;
}

function telegraph(geo,pos,rotY,dur,color=0xff2a2a,mode='u'){

function shock(pos,r,color=0xffb070,dur=.45){ const m=new THREE.Mesh(new THREE.RingGeometry(.8,1,48).rotateX(-Math.PI/2),dm(color,.9)); m.position.set(pos.x,.07,pos.z); fx.add(m);
  tween(dur,k=>{ m.scale.setScalar(.2+r*ease(k)); m.material.opacity=.9*(1-k); },()=>fx.remove(m)); }
const pgeo=new THREE.BoxGeometry(1,1,1);
function burst(pos,n,color,spd=7,life=.75,size=.2,up=1){
  const mat=new THREE.MeshBasicMaterial({color,transparent:true});
  for(let i=0;i<n;i++){ const p=new THREE.Mesh(pgeo,mat); const a=Math.random()*Math.PI*2, s=spd*(.4+Math.random()*.6);
    const v=new THREE.Vector3(Math.cos(a)*s,(2+Math.random()*4)*up,Math.sin(a)*s); const p0=pos.clone(); p0.y=Math.max(p0.y,.3); p.scale.setScalar(size*(.6+Math.random()*.8)); fx.add(p);
    const sz=p.scale.x; tween(life,k=>{ const t=k*life; p.position.set(p0.x+v.x*t, Math.max(.05,p0.y+v.y*t-9*t*t), p0.z+v.z*t); p.scale.setScalar(sz*(1-k)); p.rotation.x+=.2; },()=>fx.remove(p)); }
}
let shakeAmt=0; const shake=a=>{ shakeAmt=Math.max(shakeAmt,a); };
const ftexts=[];
function ftext(pos,txt,cls='info',life=1.1){ const el=document.createElement('div'); el.className='ft '+cls; el.textContent=txt; overlay.appendChild(el); const p=pos.clone(); const o={el,p,dy:0}; ftexts.push(o);
  tween(life,k=>{ o.dy=k*1.6; el.style.opacity=String(1-k*k); },()=>{ el.remove(); ftexts.splice(ftexts.indexOf(o),1); },true); }
function headPos(b){ const v=new THREE.Vector3(); (b.parts.head||b.root).getWorldPosition(v); return v; }
function topPos(b,extra=.8){ const v=b.root.position.clone(); v.y+=b.h+extra; return v; }
function flash(b,color,dur,int=1){ tween(dur,k=>{ const s=Math.sin(Math.PI*k)*int; for(const x of b.mats){ x.m.emissive.copy(x.e).lerp(new THREE.Color(color),s); x.m.emissiveIntensity=x.i+(1-x.i)*s; } },()=>{ for(const x of b.mats){ x.m.emissive.copy(x.e); x.m.emissiveIntensity=x.i; } }); }
function tintPermanent(b,color,int){ for(const x of b.mats){ x.e=x.e.clone().lerp(new THREE.Color(color),int); x.m.emissive.copy(x.e); x.i=Math.max(x.i,.6); x.m.emissiveIntensity=x.i; } }

/* ---------- Spieler-Treffer ---------- */
const dodgeBox=()=>document.getElementById('dodge')?.checked;
function playerDodge(from){
  const d=dirTo(from||player.root.position,player.root.position); const side=new THREE.Vector3(-d.z,0,d.x).multiplyScalar(2.6); const p0=player.root.position.clone();
  tween(.22,k=>{ player.root.position.copy(p0).addScaledVector(side,ease(k)); player.pivot.rotation.z=-Math.PI*2*k; },()=>{ player.pivot.rotation.z=0;
    tween(.5,k=>{ if(k>.4) player.root.position.copy(p0).addScaledVector(side,1-ease((k-.4)/.6)); }); });
  ftext(topPos(player,.3),'Perfekt','ok');
}
function hitPlayer(from,{force=false,dmg=.12}={}){
  if(dodgeBox() && !force){ playerDodge(from); return false; }
  ftext(topPos(player,.3),'Treffer','hit'); flash(player,0xff2020,.3); setPlayerHP(playerHP-dmg); shake(.3);
  if(def?._heal){ bossHP=Math.min(1,bossHP+.04); updBars(); ftext(topPos(bodies[0]),'+4 %','heal'); }
  if(def?._maxdown){ playerMax=Math.max(.3,playerMax-.1); setPlayerHP(Math.min(playerHP,playerMax)); ftext(topPos(player,1.0),'max. Leben −10 %','hit'); }
  return true;
}
function setPlayerHP(v){ playerHP=Math.max(.05,Math.min(playerMax,v)); updBars(); }
function updBars(){ document.getElementById('php').style.width=(playerHP*100)+'%'; document.getElementById('pmax').style.width=((1-playerMax)*100)+'%'; document.getElementById('bhp').style.width=(bossHP*100)+'%'; }
function dmgBoss(v){ bossHP=Math.max(.05,bossHP-v); updBars(); }

/* ---------- Posen ---------- */
function face(b,target=player.root.position){ const d=dirTo(b.root.position,target); b.root.rotation.y=Math.atan2(d.x,d.z); return d; }
function setArms(b,a){ const r=b.parts.armR,l=b.parts.armL; const base=r?.userData.rest??0; if(r) r.rotation.x=base+a; if(l&&b.parts.twoHand) l.rotation.x=(l.userData.rest??0)+a; }
async function windup(b,dur){ face(b); await tw(dur,k=>{ const e=ease(Math.min(1,k*1.4)); setArms(b,-2.6*e); b.pivot.rotation.x=-.2*e; }); }
async function strike(b){ await tw(.09,k=>{ setArms(b,-2.6+2.0*k); b.pivot.rotation.x=-.2+.48*k; }); tween(.4,k=>{ setArms(b,-.6*(1-k)); b.pivot.rotation.x=.28*(1-k); }); }
async function gap(b,s){ if(!s) return; ftext(topPos(b),`Lücke ${String(s).replace('.',',')} s`,'info',Math.max(.8,s)); flash(b,0xffffff,Math.min(s,.6),.35); await wait(s); }
async function goHome(b,d=.55){ const p0=b.root.position.clone(); if(dist2(p0,b.home)<.2) return; face(b,b.home); await tw(d,k=>{ b.root.position.lerpVectors(p0,b.home,ease(k)); b.root.position.y=0; }); face(b); }
const R=(b,r)=>r*b.grow;

/* ---------- Angriffe ---------- */
const ATT={
  async kette(b,p){
    const ang=(p.ang??90)*Math.PI/180;
    for(const w of p.hits){ const d=face(b); const pos=b.root.position.clone(); const r=R(b,p.r);
      telegraph(coneGeo(r,ang),pos,rotOf(d),w,p.color??0xff2a2a); await windup(b,w); strike(b);
      const pp=player.root.position, pd=dist2(pos,pp), da=Math.acos(Math.max(-1,Math.min(1,dirTo(pos,pp).dot(d))));
      const tip=pos.clone().addScaledVector(d,r*.6); burst(tip,10,p.fx??0xffc890,5,.5); shake(.25);
      if(pd<r+.5 && da<=ang/2+.05) hitPlayer(pos);
      await wait(.1); }
    await gap(b,p.gap??1.2);
  },
  async slam(b,p){
    const target=flat(player.root.position), start=b.root.position.clone(), r=R(b,p.r), warn=p.warn??1.0;
    telegraph(circleGeo(r),target,0,warn,p.color??0xff2a2a); face(b);
    await tw(.18,k=>{ b.pivot.scale.y=1-.22*k; });
    await tw(warn-.18,k=>{ b.root.position.lerpVectors(start,target,k); b.root.position.y=Math.sin(Math.PI*k)*(4+r*.5); b.pivot.scale.y=.78+.3*Math.sin(Math.PI*k); });
    b.root.position.y=0; shock(target,r*1.15,p.fx??0xffb070); burst(target,26,0xd8b080,9); shake(.9);
    if(dist2(target,player.root.position)<r) hitPlayer(target);
    await tw(.15,k=>{ b.pivot.scale.y=.75+.25*k; });
    await gap(b,p.gap??1.5); await goHome(b);
  },
  async ansturm(b,p){
    const d=face(b), start=b.root.position.clone(), len=p.len??14, w=p.w??2.2, warn=p.warn??.7;
    telegraph(lineGeo(len,w),start,rotOf(d),warn,p.color??0xff2a2a,'x');
    await tw(warn,k=>{ b.pivot.rotation.x=-.3*ease(k); });
    const pp=flat(player.root.position).sub(flat(start)); const along=pp.dot(d), perp=Math.abs(pp.x*d.z-pp.z*d.x); let hit=false;
    await tw(.32,k=>{ b.root.position.copy(start).addScaledVector(d,len*k); b.pivot.rotation.x=.45; if(!hit && along>0 && along<len*k+.5 && perp<w/2+.5){ hit=true; hitPlayer(start); } if(Math.random()<.5) burst(b.root.position,1,0x9a8a7a,2,.4,.25,.3); });
    b.pivot.rotation.x=0; shock(b.root.position,2.5,0xd8c0a0); shake(.35);
    await tw(Math.min(p.gap??1.0,1.2),k=>{ b.root.rotation.z=Math.sin(k*22)*.09*(1-k); }); b.root.rotation.z=0;
    await gap(b,.01); await goHome(b,.7);
  },
  async faecher(b,p){
    const d=face(b), warn=p.warn??.7, n=p.n??5, spread=(p.spread??60)*Math.PI/180, color=p.color??0xff7a3a;
    flash(b,color,warn,.6); await windup(b,warn); strike(b);
    const org=b.root.position.clone(); org.y=Math.min(b.h*.6,3); org.addScaledVector(d,1.2);
    const waves=p.waves??1;
    for(let wv=0;wv<waves;wv++){
      for(let i=0;i<n;i++){ let a; if(spread>=Math.PI*2-.01) a=i/n*Math.PI*2+wv*.2; else a=n===1?0:spread*(i/(n-1)-.5);
        const dir=new THREE.Vector3(d.x*Math.cos(a)-d.z*Math.sin(a),0,d.x*Math.sin(a)+d.z*Math.cos(a));
        shoot(org,dir,p.speed??11,26,p.size??.35,color); }
      if(wv<waves-1) await wait(.35);
    }
    await wait(.9); await gap(b,p.gap??.8);
  },
  async ring(b,p){
    const warn=p.warn??.5; await windup(b,warn); strike(b); shake(.5);
    const pos=flat(b.root.position), r=R(b,p.r??12), dur=p.dur??1.8, color=p.color??0xff4a2a;
    const g=new THREE.Mesh(new THREE.RingGeometry(.9,1,64).rotateX(-Math.PI/2),dm(color,.85)); g.position.set(pos.x,.08,pos.z); fx.add(g);
    const wall=new THREE.Mesh(new THREE.CylinderGeometry(1,1,1,64,1,true),dm(color,.28)); wall.position.set(pos.x,.5,pos.z); fx.add(wall);
    const pd=dist2(pos,player.root.position); let hit=false;
    await tw(dur,k=>{ const s=Math.max(.01,r*k); g.scale.setScalar(s); wall.scale.set(s,1,s); if(!hit&&Math.abs(s-pd)<.6){ hit=true; hitPlayer(pos); } g.material.opacity=.85*(1-k*.5); });
    fx.remove(g); fx.remove(wall); await gap(b,p.gap??.8);
  },
  async blink(b,p){
    const color=p.color??0xb070ff; const from=b.root.position.clone();
    burst(from,14,color,4,.5); await tw(.18,k=>b.pivot.scale.setScalar(1-k*.999));
    const d=dirTo(b.root.position,player.root.position); const to=flat(player.root.position).addScaledVector(d,p.behind??3.6);
    b.root.position.copy(to); face(b); burst(to,14,color,4,.5);
    await tw(.18,k=>b.pivot.scale.setScalar(Math.max(.001,k)));
    ftext(topPos(b),'Blink','info',.7);
    if(p.explode) await ATT.explosion(b,{r:p.explode,warn:p.warn??.6,color,gap:p.gap??1.0}); else await wait(.4);
    await tw(.15,k=>b.pivot.scale.setScalar(Math.max(.001,1-k))); b.root.position.copy(b.home); face(b); await tw(.15,k=>b.pivot.scale.setScalar(Math.max(.001,k)));
  },
  async explosion(b,p){
    const pos=flat(b.root.position), r=R(b,p.r??6), warn=p.warn??.6, color=p.color??0xff3a2a;
    telegraph(circleGeo(r),pos,0,warn,color);
    const y0=b.root.rotation.y; await tw(warn,k=>{ setArms(b,-2.8*ease(k)); if(p.spin) b.root.rotation.y=y0+k*k*Math.PI*4; });
    b.root.rotation.y=y0; strike(b);
    shock(pos,r*1.1,p.fx??color); burst(pos,32,p.fx??color,10); shake(.6);
    if(dist2(pos,player.root.position)<r) hitPlayer(pos);
    await gap(b,p.gap??1.0);
  },
  async pfuetze(b,p){
    await windup(b,p.warn??.5); strike(b);
    const n=p.n??1, color=p.color??0x8a1a2a, r=R(b,p.r??4);
    const spots=[]; for(let i=0;i<n;i++){ const t=flat(player.root.position); if(i>0){ const a=Math.random()*Math.PI*2; t.x+=Math.cos(a)*(3+Math.random()*3); t.z+=Math.sin(a)*(3+Math.random()*3); } spots.push(t); }
    await Promise.all(spots.map((t,i)=>lob(b,t,color,.6+i*.12)));
    const meshes=spots.map(t=>{ const m=new THREE.Mesh(circleGeo(1),dm(color,.55)); m.position.set(t.x,.06+Math.random()*.01,t.z); m.scale.setScalar(.01); fx.add(m); return m; });
    let hit=false; spots.forEach(t=>{ if(!hit&&dist2(t,player.root.position)<r){ hit=true; hitPlayer(t); } });
    ftext(topPos(b),p.label??'Pfütze','info');
    await tw(.3,k=>meshes.forEach(m=>m.scale.setScalar(Math.max(.01,r*ease(k)))));
    await tw(Math.min(p.dur??6,3.5),k=>meshes.forEach((m,i)=>{ m.material.opacity=.45+.15*Math.sin(k*20+i); if(Math.random()<.15) burst(new THREE.Vector3(m.position.x+(Math.random()-.5)*r,0,m.position.z+(Math.random()-.5)*r),1,color,1,.6,.18,.6); }));
    await tw(.4,k=>meshes.forEach(m=>m.material.opacity=.55*(1-k))); meshes.forEach(m=>fx.remove(m));
    return meshes;
  },
  async feuerwand(b,p){
    await windup(b,.5); strike(b);
    const c=flat(player.root.position), d=dirTo(b.root.position,c), side=new THREE.Vector3(-d.z,0,d.x), len=p.len??18;
    const start=c.clone().addScaledVector(side,-len/2);
    telegraph(lineGeo(len,1.6),start,rotOf(side),p.warn??.8,0xff6a1a,'x'); await wait(p.warn??.8);
    const fl=[]; const fm=new THREE.MeshBasicMaterial({color:0xff7a2a,transparent:true,opacity:.9});
    for(let i=0;i<=len/1.1;i++){ const m=new THREE.Mesh(K(.45,1.8,6),fm); m.position.copy(start).addScaledVector(side,i*1.1); m.position.y=.9; fx.add(m); fl.push(m); }
    shake(.4); hitPlayer(c);
    await tw(Math.min(p.dur??4,3),k=>fl.forEach((m,i)=>{ m.scale.y=.8+.5*Math.abs(Math.sin(k*30+i)); }));
    await tw(.3,k=>fl.forEach(m=>m.scale.setScalar(Math.max(.01,1-k)))); fl.forEach(m=>fx.remove(m)); await gap(b,p.gap??.6);
  },
  async riesenkugel(b,p){
    const d=face(b), color=p.color??0x9aff4a, size=p.size??2.4, target=flat(player.root.position);
    const org=b.root.position.clone(); org.y=b.h+.6;
    const m=new THREE.Mesh(S(1,16,12),new THREE.MeshBasicMaterial({color})); m.position.copy(org); fx.add(m);
    await tw(1.0,k=>{ m.scale.setScalar(.01+size*ease(k)); setArms(b,-2.9*ease(k)); });
    strike(b); const dist=dist2(org,target), t=dist/(p.speed??5);
    telegraph(circleGeo(p.r??7),target,0,t,color);
    await tw(t,k=>{ m.position.lerpVectors(org,new THREE.Vector3(target.x,size*.6,target.z),k); m.rotation.y+=.1; });
    fx.remove(m); shock(target,(p.r??7)*1.2,color); burst(target,40,color,11,.9,.3); shake(1.1);
    if(dist2(target,player.root.position)<(p.r??7)) hitPlayer(target);
    await gap(b,p.gap??1.2);
  },
  async sog(b,p){
    face(b); await tw(.5,k=>setArms(b,-1.6*ease(k)));
    const color=p.color??0xa070ff, c=flat(b.root.position), dur=p.dur??2.2, p0=player.root.position.clone();
    const ps=[]; const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:.85});
    for(let i=0;i<46;i++){ const m=new THREE.Mesh(pgeo,mat); m.scale.setScalar(.22); fx.add(m); ps.push({m,a:Math.random()*Math.PI*2,r0:6+Math.random()*10,o:Math.random()}); }
    ftext(topPos(b),'Sog','info');
    await tw(dur,k=>{ ps.forEach(q=>{ const kk=(k*1.6+q.o)%1; const r=q.r0*(1-kk); q.m.position.set(c.x+Math.cos(q.a+kk*5)*r,.5+kk*1.5,c.z+Math.sin(q.a+kk*5)*r); });
      player.root.position.lerpVectors(p0,c,.55*ease(k)); });
    ps.forEach(q=>fx.remove(q.m));
    if(p.explode) await ATT.explosion(b,{r:p.explode,warn:.45,color,gap:.01});
    await tw(.6,k=>player.root.position.lerpVectors(player.root.position.clone(),PHOME,ease(k)));
    player.root.position.copy(PHOME); setArms(b,0); await gap(b,p.gap??.8);
  },
  async meteor(b,p){
    face(b); await tw(.5,k=>setArms(b,-2.9*ease(k))); strike(b);
    const n=p.n??5, r=R(b,p.r??3), warn=p.warn??1.2, color=p.color??0xff6a1a;
    const spots=[]; for(let i=0;i<n;i++){ const t=flat(player.root.position); if(i>0){ const a=Math.random()*Math.PI*2, s=Math.random()*(p.spread??7); t.x+=Math.cos(a)*s; t.z+=Math.sin(a)*s; } spots.push(t); }
    await Promise.all(spots.map(async(t,i)=>{ await wait(i*(p.stagger??.22)); telegraph(circleGeo(r),t,0,warn,color);
      const m=new THREE.Mesh(S(Math.max(.4,r*.28),10,8),new THREE.MeshBasicMaterial({color})); fx.add(m); m.position.set(t.x+6,22,t.z-4);
      const s0=m.position.clone(); await tw(warn,k=>m.position.lerpVectors(s0,new THREE.Vector3(t.x,.3,t.z),easeIn(k)));
      fx.remove(m); shock(t,r*1.2,color); burst(t,16,color,7); shake(.45); if(dist2(t,player.root.position)<r) hitPlayer(t); }));
    await gap(b,p.gap??.8);
  },
  async atem(b,p){
    const d=face(b), len=p.len??14, ang=(p.ang??40)*Math.PI/180, color=p.color??0xff7a2a, warn=p.warn??.8;
    if(p.label) ftext(topPos(b),p.label,'info',1.4);
    const org=headPos(b); const base=flat(b.root.position);
    telegraph(coneGeo(len,ang),base,rotOf(d),warn,color);
    await tw(warn,k=>{ b.pivot.rotation.x=-.18*ease(k); });
    b.pivot.rotation.x=.12;
    const pp=player.root.position, da=Math.acos(Math.max(-1,Math.min(1,dirTo(base,pp).dot(d)))); if(dist2(base,pp)<len&&da<ang/2+.05) hitPlayer(base);
    const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8});
    await tw(p.dur??1.4,k=>{ for(let i=0;i<3;i++){ const m=new THREE.Mesh(pgeo,mat); const a=(Math.random()-.5)*ang; const dir=new THREE.Vector3(d.x*Math.cos(a)-d.z*Math.sin(a),-.12*Math.random(),d.x*Math.sin(a)+d.z*Math.cos(a));
      const o=org.clone(); fx.add(m); const L=len/14; tween(.75,kk=>{ m.position.copy(o).addScaledVector(dir,14*L*kk); m.position.y=Math.max(.2,o.y-(o.y-.5)*kk); m.scale.setScalar(.25+kk*1.1); m.material.opacity=.8*(1-kk); },()=>fx.remove(m)); } });
    b.pivot.rotation.x=0; await gap(b,p.gap??.8);
  },
  async rhythmus(b,p){
    const beats=p.beats??4, iv=p.int??.65;
    for(let i=0;i<beats;i++){ const last=i===beats-1; const t=flat(player.root.position); const r=last?7:4;
      telegraph(circleGeo(r),t,0,iv,last?0xff3a6a:0x6ab0ff); ftext(topPos(b),String(i+1),'big',.6);
      await tw(iv,k=>setArms(b,-2.6*ease(k))); strike(b); shock(t,r*1.1,last?0xff3a6a:0x6ab0ff); burst(t,14,0x6ab0ff,6); shake(last?.8:.35);
      if(dist2(t,player.root.position)<r) hitPlayer(t); }
    await gap(b,p.gap??1.0);
  },
  async muster(b,p){
    const n=p.n??5, size=4.6, c=flat(player.root.position), tiles=[];
    for(let i=0;i<9;i++){ const m=new THREE.Mesh(new THREE.PlaneGeometry(size-.3,size-.3).rotateX(-Math.PI/2),dm(0x3a5a8a,.25)); m.position.set(c.x+((i%3)-1)*size,.05,c.z+(Math.floor(i/3)-1)*size); fx.add(m); tiles.push(m); }
    const seq=[]; const pool=[...Array(9).keys()]; while(seq.length<n){ seq.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
    if(!seq.includes(4)) seq[n-1]=4;
    ftext(topPos(b),'Merken','big',1.2); await wait(.6);
    for(const [i,ix] of seq.entries()){ const m=tiles[ix]; m.material=dm(0x7ae8ff,.7); ftext(m.position.clone().setY(.5),String(i+1),'ok',.6); await wait(.45); m.material=dm(0x3a5a8a,.25); }
    await wait(.7); ftext(topPos(b),'Gleiche Reihenfolge','info',1.0);
    for(const ix of seq){ const m=tiles[ix]; telegraph(new THREE.PlaneGeometry(size-.3,size-.3).rotateX(-Math.PI/2),m.position,0,.45,0xff3a3a); await wait(.45);
      burst(m.position,14,0xff6a6a,6); shake(.3); if(Math.abs(player.root.position.x-m.position.x)<size/2&&Math.abs(player.root.position.z-m.position.z)<size/2) hitPlayer(m.position); }
    tiles.forEach(m=>fx.remove(m)); await gap(b,p.gap??.8);
  },
};
function shoot(from,dir,speed,dist,size,color){
  const m=new THREE.Mesh(S(size,8,6),new THREE.MeshBasicMaterial({color})); m.position.copy(from); fx.add(m); let hit=false;
  tween(dist/speed,k=>{ m.position.copy(from).addScaledVector(dir,dist*k); m.position.y=Math.max(.5,from.y-(from.y-1)*Math.min(1,k*4));
    if(!hit&&dist2(m.position,player.root.position)<size+.5){ hit=true; hitPlayer(from); burst(m.position,8,color,4,.4); fx.remove(m); }
    if(dist2(m.position,new THREE.Vector3())>arenaR){ fx.remove(m); } },()=>fx.remove(m));
}

/* ---------- Aufbau ---------- */
const BOSS_HOME=new THREE.Vector3(0,0,-4);
function rebuildBody(i,spec){ const old=bodies[i]; world.remove(old.root); const nb=makeBody(spec,old.home.clone()); nb.root.rotation.y=old.root.rotation.y; world.add(nb.root); bodies[i]=nb; nb.active=true; return nb; }
function buildBoss(d){
  tasks=[]; timeScale=1; fx.clear(); overlay.innerHTML=''; ftexts.length=0; document.getElementById('vign').style.opacity='0';
  bodies.forEach(b=>world.remove(b.root)); bodies=[]; def=d; d._style=0; d._heal=false; d._maxdown=false;
  const specs=d.bodies? d.bodies : [{m:d.model,off:[0,-4]}];
  for(const s of specs){ const b=makeBody(s.m,new THREE.Vector3(s.off[0],0,s.off[1])); world.add(b.root);
    if(s.state==='sleep'){ b.active=false; b.pivot.rotation.x=.9; b.pivot.position.y=-.4; }
    if(s.state==='hidden'){ b.active=false; b.hidden=true; b.pivot.scale.setScalar(.001); b.root.position.y=-1; }
    bodies.push(b); }
  makePlayer(); bodies.forEach(b=>{ if(b.active) face(b); }); face(player,bodies[0].root.position);
  setArena(20); bossHP=1; playerHP=1; playerMax=1; updBars(); shakeAmt=0;
  document.getElementById('bname').textContent=d.name;
}
const pickBody=a=>{ if(a.b!=null) return bodies[a.b]; return bodies.find(b=>b.active)||bodies[0]; };
async function exec(a){ const b=pickBody(a); if(a.kind==='rule') await RULE[a.k](b,a.p||{}); else { await ATT[a.k](b,a.p||{}); dmgBoss(.03); } }
let runToken=0;
function startOne(a,btn){ buildBoss(def); markRun(btn); const t=++runToken; exec(a).then(()=>{ if(t===runToken) markRun(null); }); }
async function playAll(){ buildBoss(def); const t=++runToken; for(const [i,a] of actions().entries()){ if(t!==runToken) return; markRun(document.querySelectorAll('.act')[i]); await exec(a); await wait(.5); } if(t===runToken) markRun(null); }
function markRun(btn){ document.querySelectorAll('.act').forEach(x=>x.classList.toggle('run',x===btn)); }
const actions=()=>[...def.attacks.map(a=>({...a,kind:'atk'})),...def.rules.map(r=>({...r,kind:'rule'}))];

/* ---------- UI ---------- */
const TIERS=[['frueh','Früh · Lvl 15/30','var(--t-frueh)'],['mittel','Mittel · Lvl 45/60','var(--t-mittel)'],['spaet','Spät · Lvl 75/90','var(--t-spaet)'],['final','Final · Lvl 100','var(--t-final)']];
const listEl=document.getElementById('list'), infoEl=document.getElementById('info');
const order=[];
for(const [t,label,c] of TIERS){
  for(const ev of [false,true]){ const items=BOSSES.filter(b=>b.tier===t && !!b.evil===ev); if(!items.length) continue;
    const h=document.createElement('div'); h.className='tier'; h.style.color=c; h.innerHTML=`<i style="background:${c}"></i>${ev?'Verdorbene Figuren':label}`; listEl.appendChild(h);
    const l=document.createElement('div'); l.className='list'; listEl.appendChild(l);
    for(const b of items){ const btn=document.createElement('button'); btn.style.setProperty('--c',c); btn.dataset.id=b.id; btn.innerHTML=`<small>${typeof b.nr==='number'?'#'+b.nr:'–'}</small>${b.name}`; btn.onclick=()=>select(b.id); l.appendChild(btn); order.push(b.id); } }
}
function select(id){
  const d=BOSSES.find(b=>b.id===id); runToken++; buildBoss(d);
  document.querySelectorAll('.list button').forEach(x=>x.classList.toggle('on',x.dataset.id===id));
  document.querySelector(`.list button[data-id="${id}"]`)?.scrollIntoView({block:'nearest'});
  const tc=TIERS.find(t=>t[0]===d.tier); const keep=document.getElementById('dodge')?.checked??false;
  const acts=actions(); let html=`<div><h2>${d.name}</h2></div>
  <div class="meta"><span class="chip" style="--c:${tc[2]}">${tc[1]}</span><span>${typeof d.nr==='number'?'#'+d.nr+' · ':''}${d.from}</span></div>
  <p class="desc">${d.desc}</p>
  <div class="row"><button id="all">Alle der Reihe nach</button><label for="dodge"><input type="checkbox" id="dodge" ${keep?'checked':''}> Spieler weicht aus</label></div>
  <h3>Angriffe</h3><div class="acts">`;
  acts.forEach((a,i)=>{ if(i===d.attacks.length) html+=`</div><h3>Regeln</h3><div class="acts">`; html+=`<button class="act ${a.kind==='rule'?'rule':''}" data-i="${i}"><kbd>${i<9?i+1:''}</kbd><strong>${a.n}</strong><span>${a.i}</span></button>`; });
  if(!d.rules.length) html+=`</div><h3>Regeln</h3><div class="acts"><span class="desc" style="color:var(--muted)">Keine Sonderregel.</span>`;
  html+=`</div><p class="note">Platzhalter-Modelle aus Grundformen. Alle Werte sind Platzhalter aus dem Boss-Plan. Rot = Warnfläche, sie füllt sich bis zum Treffer. „Lücke“ = Strafzeit, in der der Boss +25 % Schaden nimmt.</p>`;
  infoEl.innerHTML=html;
  infoEl.querySelectorAll('.act').forEach(btn=>btn.onclick=()=>startOne(acts[+btn.dataset.i],btn));
  document.getElementById('all').onclick=playAll;
  try{ localStorage.setItem('bossviewer',id); }catch(e){}
  try{ if(location.hash!=='#'+id) history.replaceState(null,'','#'+id); }catch(e){}
}
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  const i=order.indexOf(def.id);
  if(e.key==='ArrowDown'){ e.preventDefault(); select(order[(i+1)%order.length]); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); select(order[(i-1+order.length)%order.length]); }
  else if(e.key===' '){ e.preventDefault(); playAll(); }
  else if(/^[1-9]$/.test(e.key)){ const a=actions()[+e.key-1]; if(a) startOne(a,document.querySelectorAll('.act')[+e.key-1]); }
});
addEventListener('hashchange',()=>{ const id=location.hash.slice(1); if(BOSSES.some(b=>b.id===id)&&id!==def?.id) select(id); });

/* ---------- Loop ---------- */
function resize(){ const r=canvas.parentElement.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); camera.aspect=r.width/Math.max(1,r.height); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(canvas.parentElement);
const clock=new THREE.Clock(); let T=0; const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(){
  const dt=Math.min(.05,clock.getDelta()); T+=dt; tick(dt);
  for(const b of [...bodies,player]){ if(!b) continue; if(b.float) b.model.position.y=.3+Math.sin(T*2+b.home.x)*.12; else b.model.position.y=0;
    if(b.parts.tentacles) b.parts.tentacles.forEach(t=>{ let j=0; t.children.forEach(function sw(c){ c.rotation.x=Math.sin(T*1.6+t.userData.ph+j)*.18; j++; c.children.forEach(cc=>{ if(cc.isGroup) sw(cc); }); }); });
    if(b.root.children.includes(b.parts.lava)) b.parts.lava.material.emissiveIntensity=1+.3*Math.sin(T*3); }
  if(shakeAmt>.001 && !reduce){ world.position.set((Math.random()-.5)*shakeAmt,(Math.random()-.5)*shakeAmt*.5,(Math.random()-.5)*shakeAmt); shakeAmt*=Math.exp(-dt*7); } else world.position.set(0,0,0);
  controls.update(); renderer.render(scene,camera);
  const w=canvas.clientWidth,h=canvas.clientHeight;
  for(const o of ftexts){ const v=o.p.clone(); v.y+=o.dy; v.project(camera); o.el.style.transform=`translate(${(v.x*.5+.5)*w}px,${(-v.y*.5+.5)*h}px) translate(-50%,-50%)`; }
  requestAnimationFrame(loop);
}
let start=location.hash.slice(1); if(!BOSSES.some(b=>b.id===start)){ try{ start=localStorage.getItem('bossviewer'); }catch(e){} }
if(!BOSSES.some(b=>b.id===start)) start='hogger';
resize(); select(start); loop();
</script>
</body>
