<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kosmetik-Viewer</title>
<style>
  :root { --bg: #0f0d13; --panel: #17141c; --line: #2a2533; --text: #ece8f2; --mute: #a49cb3; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Inter, system-ui, sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; display: flex; gap: 6px; align-items: center; padding: 10px 14px; overflow-x: auto; scrollbar-width: none; }
  .bar::-webkit-scrollbar { display: none; }
  #top { top: 0; background: linear-gradient(#0f0d13f0, #0f0d1300); }
  #trig { bottom: 0; background: linear-gradient(#0f0d1300, #0f0d13f0); padding-top: 18px; }
  #top h1 { margin: 0 10px 0 0; font-size: 19px; white-space: nowrap; }
  select, button { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: 600 13.5px Inter, system-ui, sans-serif; white-space: nowrap; flex: none; cursor: pointer; }
  button[aria-pressed="true"] { background: #e8b23a; color: #0f0d13; border-color: #e8b23a; }
  button.ev:active { background: #3a3346; }
  .rng { display: flex; align-items: center; gap: 6px; flex: none; font-size: 12.5px; color: var(--mute); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; min-height: 40px; }
  .rng input { width: 90px; }
  .rng b { color: var(--text); min-width: 34px; }
  #info { position: fixed; right: 14px; top: 64px; width: min(380px, calc(100vw - 28px)); max-height: calc(100vh - 150px); overflow: auto; padding: 12px 14px; background: #17141ce6; border: 1px solid var(--line); border-radius: 12px; }
  #info h2 { margin: 0 0 6px; font-size: 16px; }
  .row { display: grid; grid-template-columns: 58px 1fr; gap: 2px 8px; font-size: 13px; padding: 5px 0; border-bottom: 1px solid #2a2533; }
  .row b { color: var(--mute); font-weight: 600; }
  .row select { min-height: 34px; font-size: 13px; width: 100%; }
  .row .t { grid-column: 2; color: #cfc6dc; font-size: 12.5px; }
  .star { color: #ffcf4a; }
  .mute { color: var(--mute); font-size: 12px; margin: 8px 0 0; }
  body:not(.showInfo) #info { display: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  #labels div { position: absolute; transform: translate(-50%, -100%); font-weight: 700; font-size: 12px; text-shadow: 0 1px 3px #000; text-align: center; max-width: 140px; }
  #labels .say { background: #fff; color: #111; padding: 3px 8px; border-radius: 10px; font-size: 14px; text-shadow: none; }
  @media (max-width: 760px) {
    #top h1 { display: none; }
    #info { left: 8px; right: 8px; top: auto; bottom: 72px; width: auto; max-height: 42vh; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div class="bar" id="top">
  <h1>Kosmetik-Viewer</h1>
  <button id="bInfo" aria-pressed="false">Slots/Info</button>
  <select id="sMode" aria-label="Ansicht"></select>
  <button id="bRand">Zufällig</button>
  <button id="bAuto" aria-pressed="true">Auto-Events</button>
  <button id="bSpin" aria-pressed="true">Drehen</button>
  <select id="sEl" aria-label="Element"></select>
</div>
<div id="info"></div>
<div class="bar" id="trig">
  <button class="ev" data-ev="kill">Kill</button>
  <button class="ev" data-ev="crit">Crit</button>
  <button class="ev" data-ev="cast">Cast</button>
  <button class="ev" data-ev="hit">Treffer</button>
  <button class="ev" data-ev="streak">Kill-Streak</button>
  <button class="ev" data-ev="level">Level-Up</button>
  <button class="ev" data-ev="idle">10 s Idle</button>
  <button id="bSprint" aria-pressed="false">Sprint</button>
  <label class="rng">Mana <input id="rMana" type="range" min="0" max="100" value="70"><b id="vMana">70</b></label>
  <label class="rng">Kills im Run <input id="rKills" type="range" min="0" max="1200" value="450"><b id="vKills">450</b></label>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0f0d13);
const cam = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
const ctl = new OrbitControls(cam, canvas); ctl.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x2a2030, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2.5, 4, 3); scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshToonMaterial({ color: 0x1d1924 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

// ---------------- Material (Toon wie Waffen) ----------------
const ramp = (() => { const d = new Uint8Array([70, 70, 70, 255, 160, 160, 160, 255, 255, 255, 255, 255]); const t = new THREE.DataTexture(d, 3, 1); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const cache = {};
const toon = (c, o = {}) => { const k = c + JSON.stringify(o); return cache[k] ||= new THREE.MeshToonMaterial({ color: c, gradientMap: ramp, ...o }); };
const glow = c => cache['g' + c] ||= new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(1.3) });
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x0a0806, side: THREE.BackSide });
outlineMat.onBeforeCompile = sh => { sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\ntransformed += normal * 0.012;'); };
function addOutlines(root) { const list = []; root.traverse(o => { if (o.isMesh && o.material.isMeshToonMaterial && !o.material.transparent && !o.userData.noOutline) list.push(o); }); for (const m of list) m.add(new THREE.Mesh(m.geometry, outlineMat)); }
function canvasTex(draw, w = 64, h = 64) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
const dotTex = canvasTex((g, w) => { const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2); r.addColorStop(0, '#fff'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, w); });
const sprite = (col, size, op = 1) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, color: col, transparent: true, opacity: op, depthWrite: false, blending: THREE.AdditiveBlending })); s.scale.setScalar(size); return s; };

// ---------------- Geometrie-Helfer ----------------
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function mesh(geo, mat, parent, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; }
function seg(a, b, r1, r2, mat, parent, joint = true) { const d = b.clone().sub(a), len = d.length(); const m = mesh(new THREE.CylinderGeometry(r2, r1, len, 14), mat, parent);
  m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize()); if (joint) mesh(new THREE.SphereGeometry(r1, 14, 10), mat, parent).position.copy(a); return m; }
function torso(parent, mat, yTop, yBot, rTop, rBot, depth = 0.62) { const m = mesh(new THREE.CylinderGeometry(rTop, rBot, yTop - yBot, 20), mat, parent, 0, (yTop + yBot) / 2, 0); m.scale.z = depth;
  const cap = mesh(new THREE.SphereGeometry(rTop, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), mat, parent, 0, yTop, 0); cap.scale.set(1, 0.35, depth); return m; }
const tube = (pts, r, mat, parent, closed = false) => mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, closed), 64, r, 6, closed), mat, parent);
const helix = (r, h, turns, y0 = 0) => { const p = []; for (let i = 0; i <= 60; i++) { const a = i / 60 * turns * Math.PI * 2; p.push(V(Math.cos(a) * r, y0 + i / 60 * h, Math.sin(a) * r)); } return p; };
// Teil entlang eines Unterarms ausrichten
// ---- Formen-Werkzeuge: saubere Silhouetten statt Grundkörper (Manga-Rüstung: große klare Platten, dunkle Kanten) ----
// plate: 2D-Umriss (x,y in m) extrudiert, mit kleiner Fase
function plate(pts, depth, mat, parent, x = 0, y = 0, z = 0) {
  const sh = new THREE.Shape(); pts.forEach(([px, py], i) => i ? sh.lineTo(px, py) : sh.moveTo(px, py)); sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: true, bevelSize: 0.004, bevelThickness: 0.004, bevelSegments: 1 }); g.translate(0, 0, -depth / 2);
  return mesh(g, mat, parent, x, y, z);
}
// Umrisse
const leaf = (l, w) => [[0, 0], [w * 0.5, l * 0.25], [w * 0.35, l * 0.7], [0, l], [-w * 0.2, l * 0.6], [-w * 0.3, l * 0.2]];          // Feder / Klinge
const blade = (l, w) => [[-w / 2, 0], [w / 2, 0], [w * 0.3, l * 0.75], [0, l], [-w * 0.15, l * 0.7]];                                // Klinge, leicht gebogen
const spike = (l, w) => [[-w / 2, 0], [w / 2, 0], [0, l]];
const spikeDown = (l, w) => [[-w / 2, 0], [0, -l], [w / 2, 0]];
const diamond = (h, w) => [[0, -h / 2], [w / 2, 0], [0, h / 2], [-w / 2, 0]];
const crescent = (r, t, n = 10) => { const a = [], b = []; for (let i = 0; i <= n; i++) { const u = Math.PI * (0.15 + 0.7 * i / n); a.push([Math.cos(u) * r, Math.sin(u) * r]); b.unshift([Math.cos(u) * (r - t) , Math.sin(u) * (r - t) + t * 0.4]); } return a.concat(b); };
const tablet = (h, w) => [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h * 0.3], [0, h / 2], [-w / 2, h * 0.3]];
const kite = (h, w) => [[0, -h / 2], [w / 2, h * 0.15], [w * 0.4, h / 2], [-w * 0.4, h / 2], [-w / 2, h * 0.15]];
// taper: Röhre entlang einer Kurve, Radius r0 → r1 (Hörner, Schal-Enden)
function taper(pts, r0, r1, mat, parent, flat = 1) {
  const curve = new THREE.CatmullRomCurve3(pts), N = 24, R = 8, pos = [], idx = [];
  const frames = curve.computeFrenetFrames(N, false);
  for (let i = 0; i <= N; i++) { const p = curve.getPointAt(i / N), r = r0 + (r1 - r0) * (i / N);
    for (let j = 0; j < R; j++) { const a = j / R * Math.PI * 2, n = frames.normals[i].clone().multiplyScalar(Math.cos(a) * r), bn = frames.binormals[i].clone().multiplyScalar(Math.sin(a) * r * flat); const v = p.clone().add(n).add(bn); pos.push(v.x, v.y, v.z); } }
  for (let i = 0; i < N; i++) for (let j = 0; j < R; j++) { const a = i * R + j, b = i * R + (j + 1) % R, c = (i + 1) * R + j, d = (i + 1) * R + (j + 1) % R; idx.push(a, c, b, b, c, d); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return mesh(g, mat, parent);
}
// wrap: gebogene Platte, die der Körperform folgt (Teil eines Zylinders). theta 0 = vorne
const wrap = (r1, r2, h, t0, tl, mat, parent, x = 0, y = 0, z = 0, depth = 0.7) => { const m = mesh(new THREE.CylinderGeometry(r1, r2, h, 24, 1, true, t0, tl), ds(mat), parent, x, y, z); m.scale.z = depth; return m; };
const ds = mat => mat.side === THREE.DoubleSide ? mat : toon(mat.color.getHex(), { side: THREE.DoubleSide, ...(mat.transparent ? { transparent: true, opacity: mat.opacity } : {}) });
const alongArm = (g, el, wr, t = 0.55) => { g.position.copy(el).lerp(wr, t); g.quaternion.setFromUnitVectors(V(0, 1, 0), wr.clone().sub(el).normalize()); };

// Manga-Proportionen wie im Set-Skins Viewer (7,5 Köpfe, V-Torso)
const P = { head: V(0, 1.67, 0), shL: V(-0.19, 1.44, 0), elL: V(-0.24, 1.14, -0.01), wrL: V(-0.26, 0.88, 0.02), haL: V(-0.265, 0.83, 0.02),
  shR: V(0.19, 1.44, 0), elR: V(0.24, 1.14, 0), wrR: V(0.26, 0.9, 0.06), haR: V(0.265, 0.85, 0.07),
  hipL: V(-0.09, 0.9, 0), knL: V(-0.1, 0.49, 0.01), anL: V(-0.105, 0.08, 0), hipR: V(0.09, 0.9, 0), knR: V(0.1, 0.49, 0.01), anR: V(0.105, 0.08, 0) };

// ================= Kosmetik-Viewer (Auswahl Kevin 10.11.) =================
// Jedes Teil: fester Look (weiß = grün), reagiert auf ein Spiel-Ereignis. ⭐ = Meilenstein-Teil, Rest aus der Kosmetik-Box.
const SLOTS = { kopf: 'Kopf', hals: 'Hals', ruecken: 'Rücken', arme: 'Arme', koerper: 'Körper' };
const ELS = { frost: ['Frost', 0x9fe4ff], feuer: ['Feuer', 0xff7a22], blitz: ['Blitz', 0xffe866], seuche: ['Seuche', 0x7dff3a] };
const ST = { mode: 'none', spin: true, auto: true, el: 'frost', sprint: false, mana: 70, kills: 450,
  sel: { kopf: 'pappkrone', hals: 'goldkette', ruecken: 'killflagge', arme: 'handschellen', koerper: 'dreiteiler' } };
const EV = { kill: -99, crit: -99, cast: -99, hit: -99, streak: -99, level: -99, idle: -99 };
let now = 0;
const since = e => now - EV[e];
const ease = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);
const MAT = { schwarz: toon(0x18161c), weiss: toon(0xf4f1ea), gold: toon(0xe8b23a), stahl: toon(0xb8bcc8), holz: toon(0x8a5a32), haut: toon(0xf1dcc6) };
const glass = (c, o) => { const m = new THREE.MeshToonMaterial({ color: c, gradientMap: ramp, transparent: true, opacity: o, depthWrite: false }); return m; };
const texMat = (tex, c = 0xffffff, side = THREE.FrontSide) => new THREE.MeshToonMaterial({ color: c, map: tex, gradientMap: ramp, side });
const say = (F, text, obj, dur = 1.3) => F.userData.says.push({ text, obj, until: now + dur });
function spawn(F, parent, pos, vel, col, size, life, grav = 0, op = 1) { const s = sprite(col, size, op); s.position.copy(pos); parent.add(s); F.userData.ps.push({ s, vel, life, t: 0, grav, op, parent }); }
const rnd = (a, b) => a + Math.random() * (b - a);
// Halskurve: Kette um den Hals, vorne tiefer
const neckLoop = (yFront, rx = 0.15, rz = 0.145, yBack = 1.46) => { const p = []; for (let i = 0; i < 40; i++) { const a = i / 40 * Math.PI * 2, f = ((1 + Math.cos(a)) / 2) ** 2; p.push(V(Math.sin(a) * rx * (0.75 + 0.25 * (1 - f)), yBack - (yBack - yFront) * f, Math.cos(a) * rz)); } return p; };
const SIDES = ctx => [[ctx.armL, P.shL, P.elL, P.wrL, P.haL, -1], [ctx.armR, P.shR, P.elR, P.wrR, P.haR, 1]];
// Hülle über Körper + Gliedmaßen (Onesie / Anzug)
function suit(ctx, mat, o = {}) { const { body } = ctx;
  torso(body, mat, 1.475, 0.86, 0.22, o.rb ?? 0.172, 0.66);
  for (const [arm, sh, el, wr] of SIDES(ctx)) { mesh(new THREE.SphereGeometry(0.074, 14, 10), mat, arm).position.copy(sh); seg(sh, el, 0.064, 0.056, mat, arm, false); seg(el, wr, 0.056, o.cuff ?? 0.05, mat, arm); }
  if (o.legs !== false) for (const [hip, kn, an] of [[P.hipL, P.knL, P.anL], [P.hipR, P.knR, P.anR]]) { seg(hip, kn, 0.085, 0.07, o.legMat ?? mat, body); seg(kn, an.clone().add(V(0, 0.04, 0)), 0.066, 0.06, o.legMat ?? mat, body); } }
function hood(ctx, mat, r = 0.15) { const h = mesh(new THREE.SphereGeometry(r, 22, 14, Math.PI / 2 + 0.85, Math.PI * 2 - 1.7, 0, Math.PI * 0.72), ds(mat), ctx.head, 0, 0.01, -0.005); h.scale.set(1, 1.08, 1); return h; }
const spotTex = canvasTex((g, w, h) => { g.fillStyle = '#f6f3ec'; g.fillRect(0, 0, w, h); g.fillStyle = '#1b1a1e'; for (let i = 0; i < 7; i++) { g.beginPath(); const x = Math.random() * w, y = Math.random() * h; for (let j = 0; j < 9; j++) { const a = j / 9 * 6.28, r = rnd(8, 18); g[j ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r * 0.8); } g.fill(); } }, 128, 128);
spotTex.wrapS = spotTex.wrapT = THREE.RepeatWrapping; spotTex.repeat.set(2, 1);
const tartan = canvasTex((g, w) => { g.fillStyle = '#9c1c26'; g.fillRect(0, 0, w, w);
  g.fillStyle = 'rgba(20,60,40,.85)'; for (const x of [8, 40]) { g.fillRect(x, 0, 14, w); g.fillRect(0, x, w, 14); }
  g.fillStyle = 'rgba(10,10,20,.7)'; for (const x of [14, 46]) { g.fillRect(x, 0, 2, w); g.fillRect(0, x, w, 2); }
  g.fillStyle = 'rgba(255,220,120,.6)'; for (const x of [30, 62]) { g.fillRect(x, 0, 1, w); g.fillRect(0, x, w, 1); } }, 64, 64);
tartan.wrapS = tartan.wrapT = THREE.RepeatWrapping; tartan.repeat.set(5, 1.6);

const COS = {
  // ---------------- Kopf ----------------
  pappkrone: { slot: 'kopf', name: 'Pappkrone', trig: 'rutscht schief bei Treffer, sitzt beim Level-Up wieder gerade', star: 'erster Boss-Kill',
    build(ctx) { const g = new THREE.Group(); g.position.y = 0.105; ctx.head.add(g); const pap = toon(0xc9a46a);
      mesh(new THREE.CylinderGeometry(0.106, 0.1, 0.055, 24, 1, true), ds(pap), g);
      for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2, p = plate(spike(0.075, 0.07), 0.004, pap, g, Math.sin(a) * 0.104, 0.027, Math.cos(a) * 0.104); p.rotation.y = a; p.rotation.x = -0.12;
        mesh(new THREE.SphereGeometry(0.009, 8, 6), toon([0xd8262a, 0x3a7bd8, 0x3ad65a][i % 3]), g, Math.sin(a) * 0.112, 0, Math.cos(a) * 0.112); }
      let tilt = 0, target = 0, side = 1;
      ctx.on(e => { if (e === 'hit') { target = Math.min(0.5, target + 0.22); } if (e === 'level') target = 0; });
      ctx.tick(() => { tilt += (target - tilt) * 0.12; g.rotation.z = tilt * side; g.position.x = tilt * 0.06 * side; g.position.y = 0.105 - tilt * 0.03; }); } },
  fischglas: { slot: 'kopf', name: 'Fischglas', trig: 'Fisch flitzt beim Sprint, Blasen beim Cast', star: null,
    build(ctx) { const H = ctx.head; const gl = mesh(new THREE.SphereGeometry(0.205, 28, 20), glass(0xcfeeff, 0.18), H, 0, 0.01, 0.01); gl.userData.noOutline = true; gl.renderOrder = 2;
      const w = mesh(new THREE.SphereGeometry(0.2, 28, 14, 0, Math.PI * 2, Math.PI * 0.5, Math.PI * 0.5), glass(0x4aa8ff, 0.22), H, 0, 0.01, 0.01); w.renderOrder = 1;
      const rim = mesh(new THREE.TorusGeometry(0.1, 0.012, 8, 28), MAT.stahl, H, 0, -0.17, 0.01); rim.rotation.x = Math.PI / 2;
      const fish = new THREE.Group(); H.add(fish); const fb = mesh(new THREE.SphereGeometry(1, 12, 8), toon(0xff8a2a), fish); fb.scale.set(0.012, 0.022, 0.036);
      const tail = plate([[0, 0], [0.022, 0.02], [-0.022, 0.02]], 0.004, toon(0xffb04a), fish, 0, 0, -0.03); tail.rotation.x = Math.PI / 2;
      mesh(new THREE.SphereGeometry(0.004, 6, 4), MAT.schwarz, fish, 0.011, 0.006, 0.02);
      let a = 0; ctx.tick((t, dt) => { a += dt * (ST.sprint ? 7 : 1.4); const r = 0.165; fish.position.set(Math.sin(a) * r, -0.06 + Math.sin(a * 2) * 0.015, Math.cos(a) * r); fish.rotation.y = a + Math.PI / 2; tail.rotation.y = Math.sin(t * (ST.sprint ? 30 : 9)) * 0.5; });
      ctx.on(e => { if (e === 'cast') for (let i = 0; i < 7; i++) spawn(ctx.F, H, V(rnd(-0.1, 0.1), rnd(-0.12, 0), rnd(-0.05, 0.14)), V(0, rnd(0.15, 0.3), 0), 0xd8f4ff, 0.035, 1.0); }); } },
  gluehbirne: { slot: 'kopf', name: 'Ideen-Glühbirne', trig: 'leuchtet bei Crit', star: null,
    build(ctx) { const g = new THREE.Group(); ctx.head.add(g);
      const bulb = mesh(new THREE.SphereGeometry(0.06, 18, 14), glass(0xfff6d8, 0.75), g, 0, 0.06, 0); bulb.scale.y = 1.15;
      for (let i = 0; i < 3; i++) mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.012, 14), MAT.stahl, g, 0, -0.002 - i * 0.014, 0);

// ---------------- Figur ----------------
function buildFigure(sel) {
  const F = new THREE.Group(); Object.assign(F.userData, { ps: [], says: [], ticks: [], ons: [], hop: 0 });
  const body = new THREE.Group(); F.add(body);
  const armL = new THREE.Group(), armR = new THREE.Group(); body.add(armL, armR);
  const head = new THREE.Group(); head.position.copy(P.head); body.add(head);
  const skin = MAT.haut, cloth = toon(0x2c2a38), dark = toon(0x1c1a24);
  seg(V(0, 1.47, 0), V(0, 1.58, 0), 0.05, 0.045, skin, body, false);
  torso(body, cloth, 1.46, 0.98, 0.205, 0.145, 0.62);
  const pelvis = mesh(new THREE.CylinderGeometry(0.15, 0.16, 0.16, 18), dark, body, 0, 0.92, 0); pelvis.scale.z = 0.7;
  for (const [arm, sh, el, wr, ha] of [[armL, P.shL, P.elL, P.wrL, P.haL], [armR, P.shR, P.elR, P.wrR, P.haR]]) {
    mesh(new THREE.SphereGeometry(0.066, 14, 10), cloth, arm).position.copy(sh); seg(sh, el, 0.056, 0.047, cloth, arm, false); seg(el, wr, 0.047, 0.04, cloth, arm);
    const h = mesh(new THREE.SphereGeometry(1, 12, 8), skin, arm); h.position.copy(ha); h.scale.set(0.038, 0.055, 0.03); }
  for (const [hip, kn, an] of [[P.hipL, P.knL, P.anL], [P.hipR, P.knR, P.anR]]) { seg(hip, kn, 0.075, 0.062, dark, body); seg(kn, an, 0.056, 0.05, dark, body); mesh(new THREE.BoxGeometry(0.1, 0.07, 0.24), toon(0x14121a), body, an.x, 0.035, 0.05); }
  const skull = mesh(new THREE.SphereGeometry(0.12, 22, 16), skin, head); skull.scale.set(0.9, 1.1, 0.95);
  for (const x of [-0.042, 0.042]) { const e = mesh(new THREE.SphereGeometry(1, 10, 8), toon(0x15121a), head, x, -0.005, 0.104); e.scale.set(0.013, 0.02, 0.01); }
  const hair = mesh(new THREE.SphereGeometry(0.128, 18, 10, 0, Math.PI * 2, 0, Math.PI * 0.42), toon(0x2a221c), head, 0, 0.02, -0.01); hair.scale.set(0.93, 1.1, 1);
  const ctx = { F, body, head, armL, armR, tick: fn => F.userData.ticks.push(fn), on: fn => F.userData.ons.push(fn) };
  for (const id of Object.values(sel)) if (id) COS[id].build(ctx);
  // Arme um die Schulter drehbar machen (für Marionette / Gähnen)
  for (const [arm, sh] of [[armL, P.shL], [armR, P.shR]]) { arm.children.forEach(c => c.position.sub(sh)); arm.position.copy(sh); }
  addOutlines(F); F.userData.body = body;
  return F;
}

      f.position.set(((i % cols) - (n - 1) / 2) * dx, ((rows - 1) / 2 - row) * dy, near ? row * 0.5 : 0); scene.add(f); figs.push(f); });

      + '<p class="mute">Weiß = Grün (gleicher Look). Duplikate → Staub. ⭐ nur über Meilenstein, Rest aus der Kosmetik-Box (120 Staub). Buttons unten lösen die Ereignisse aus.</p>';

const labels = $('labels'), tmp = new THREE.Vector3();

let wasP = null;
