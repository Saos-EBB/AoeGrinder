    zauberer: ['Glutbeschwörer', 'h', { ink:0x2a0c08, ac:0x5a140c, gl:0xff7020, robe:true, horns:true, weapon:'orb' }],

// ---------- Szene ----------
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 400);
camera.position.set(0, 9, 30);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0); controls.enableDamping = true; controls.maxPolarAngle = 1.45;
const hemi = new THREE.HemisphereLight(0xffffff, 0x222222, 1.4); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(8, 14, 10); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(400, 48).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color:0x333333 }));
scene.add(ground);

// ---------- Material im Strich-Stil: Toon mit 3 Stufen + Lichtrand (wie strichMagier.ts) ----------
const grad = new THREE.DataTexture(new Uint8Array([80, 80, 80, 255, 170, 170, 170, 255, 255, 255, 255, 255]), 3, 1);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const RIM = '0.5, 0.55, 0.65';
const mats = new Map();
function mat(c, o = {}) {
  const k = c + JSON.stringify(o);
  if (mats.has(k)) return mats.get(k);
  let m;
  if (o.glow) m = new THREE.MeshBasicMaterial({ color:c, transparent:!!o.op, opacity:o.op ?? 1, side:o.side ?? THREE.FrontSide });
  else {
    m = new THREE.MeshToonMaterial({ color:c, gradientMap:grad, transparent:!!o.op, opacity:o.op ?? 1, side:o.side ?? THREE.FrontSide, depthWrite:!o.op });
    m.onBeforeCompile = sh => { sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>',
      `outgoingLight += vec3(${RIM}) * pow(1.0 - saturate(dot(normalize(normal), normalize(vViewPosition))), 2.6);\n#include <opaque_fragment>`); };
  }
  mats.set(k, m); return m;
}
const M = (geo, m) => new THREE.Mesh(geo, m);
const at = (o, x, y, z, rx = 0, ry = 0, rz = 0, s) => { o.position.set(x, y, z); o.rotation.set(rx, ry, rz); if (s) o.scale.set(...s); return o; };
const capDown = (r, len, rs = 6) => { const g = new THREE.CapsuleGeometry(r, len, 2, rs); g.translate(0, -len / 2, 0); return g; };
const ico = (r, d = 0) => new THREE.IcosahedronGeometry(r, d);
const lathe = (pts, seg = 8) => new THREE.LatheGeometry(pts.map(([a, b]) => new THREE.Vector2(a, b)), seg);
const cone = (r, h, seg = 5) => new THREE.ConeGeometry(r, h, seg);
const G = (x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); return g; };
// Zwei-Glied-Arm/Bein wie beim Strichmagier: oben, unten, Ende
function joint(parent, x, y, z, r1, l1, r2, l2, m) {
  const up = G(x, y, z); parent.add(up); up.add(M(capDown(r1, l1), m));
  const lo = G(0, -l1, 0); up.add(lo); lo.add(M(capDown(r2, l2), m));
  const end = G(0, -l2, 0); lo.add(end);
  return { up, lo, end };
}

// ---------- Waffen (schlank, Metall hell, Holz dunkel) ----------
function weapon(kind, o) {
  const g = G(), wood = mat(0x4a3424), iron = mat(0xa8adb5), big = o.bigWeapon ? 1.7 : 1, glow = mat(o.gl ?? 0xffffff, { glow:true });
  const add = (geo, m, ...p) => g.add(at(M(geo, m), ...p));
  switch (kind) {
    case 'sword':   add(new THREE.BoxGeometry(.05, 1.2 * big, .14 * big), iron, 0, -.65 * big, .08); add(new THREE.BoxGeometry(.28, .04, .07), wood, 0, -.05, .08); break;
    case 'axe':     add(capDown(.025, 1.3 * big), wood, 0, .3, .05); add(new THREE.CylinderGeometry(.32 * big, .32 * big, .04, 10, 1, false, 0, Math.PI), iron, 0, -.85 * big, .1, 0, 0, Math.PI / 2); break;
    case 'club':    add(lathe([[0, 0], [.05, 0], [.07, -.5], [.14, -.9], [.1, -1.05], [0, -1.08]]), wood, 0, 0, .05); break;
    case 'hammer':  add(capDown(.03, 1.2), wood, 0, .2, .05); add(new THREE.BoxGeometry(.5, .3, .3), iron, 0, -1, .05); break;
    case 'cleaver': add(new THREE.BoxGeometry(.04, .6 * big, .34 * big), iron, 0, -.4, .18); break;
    case 'staff':   add(capDown(.025, 1.8), wood, 0, .8, .05); add(ico(.09), glow, 0, .9, .05); break;
    case 'spear':   add(capDown(.022, 2), wood, 0, .9, .05); add(cone(.05, .3, 4), iron, 0, 1.0, .05); break;
    case 'orb':     add(ico(.13, 1), glow, 0, -.05, .2); break;
    case 'rock':    add(new THREE.DodecahedronGeometry(.17), mat(0x6a6458), 0, -.05, .15); break;
    case 'blob':    add(ico(.15, 1), mat(0x6a7a24), 0, -.05, .15); break;
    case 'bone':    add(capDown(.03, .6), mat(0xd8ceb0), 0, .2, .1, 1.2); break;
    case 'ember':   add(ico(.12, 1), mat(0xff7020, { glow:true }), 0, -.05, .15); break;
    case 'lantern': add(capDown(.012, .4), iron, 0, 0, .05); add(new THREE.BoxGeometry(.14, .2, .14), mat(o.gl, { glow:true, op:.9 }), 0, -.5, .05); break;
    case 'censer':  add(capDown(.008, .5), iron, 0, 0, .05); add(ico(.1, 1), mat(0x7a6a3a), 0, -.58, .05); add(ico(.05), glow, 0, -.5, .05); break;
    case 'whip':    for (let i = -1; i <= 1; i++) add(capDown(.012, 1), mat(0x3a2a20), i * .05, 0, .05, 0, 0, i * .25); break;
    case 'blades':  add(new THREE.BoxGeometry(.03, 1, .1), iron, 0, -.5, .05, .25); break;
    case 'hooks':   add(new THREE.TorusGeometry(.15, .022, 5, 12, Math.PI * 1.3), iron, 0, -.15, .1); break;
    case 'flail':   add(capDown(.02, .6), wood, 0, 0, .05); add(capDown(.008, .4), iron, 0, -.6, .05); add(ico(.18, 0), iron, 0, -1.1, .05); break;
  }
  return g;
}

// ---------- Mensch (Strichfigur) ----------
function humanoid(o) {
  const root = G(), g = G(); root.add(g);
  const op = o.ghost ? { op:.6 } : {};
  const ink = mat(o.ink, op), ac = mat(o.ac ?? o.ink, op), glow = o.gl ? mat(o.gl, { glow:true }) : null;
  const fat = o.fat ?? 1, thin = o.thin ?? 1, W = fat * thin, aL = o.armLen ?? 1, lL = o.legLen ?? 1;
  const L1 = .46 * lL, L2 = .46 * lL, A1 = .31 * aL, A2 = .29 * aL, rk = Math.sqrt(fat) * thin;
  const P = { root, kind:'h', o };
  const hipY = o.float ? 1.0 : L1 + L2;
  const hips = G(0, hipY, 0); g.add(hips);
  hips.add(at(M(new THREE.SphereGeometry(.14, 7, 4), ink), 0, 0, 0, 0, 0, 0, [1.25 * W, .8, .9 * W]));
  if (!o.float) {
    for (const s of [1, -1]) {

  const top = P.height + .5;
  if (z === 'heal') { fx.add(ring(0x60ff70, P.width * .5)); const c = new THREE.Group(); c.add(bx(.12, .45, .12, mat(0x60ff70, { glow:true })), bx(.45, .12, .12, mat(0x60ff70, { glow:true }))); fx.add(at(c, 0, top, 0)); P.spin = c; }
  if (z === 'shield') { const sp = new THREE.Mesh(new THREE.SphereGeometry(Math.max(P.height, P.width) * .6, 20, 14), mat(0x6aa8ff, { glow:true, op:.22 })); fx.add(at(sp, 0, P.height * .5, 0)); P.pulse = sp; }
  if (z === 'haste') { const r = ring(0xffd040, 3.5); fx.add(r); P.pulse = r; fx.add(at(cn(.18, .4, mat(0xffd040, { glow:true }), 3), 0, top, 0, Math.PI)); }

  }
}

// ---------- Animation ----------
let attackT = -9;
function animate(P, t, sel) {
  const o = P.o, j = o.jerky ? (x) => Math.round(x * 3) / 3 : (x) => x;
  const a = sel && t - attackT < 1.2 ? Math.sin(Math.min(1, (t - attackT) / 1.2) * Math.PI) : 0;
  if (P.kind === 'h') {
    const sw = j(Math.sin(t * 2 + P.phase)) * .12;
    P.armL.rotation.x = sw; P.armR.rotation.x = -sw - a * 2.4; if (P.faR) P.faR.rotation.x = -.25 - a * .6;
    if (P.armL2) { P.armL2.rotation.x = -sw * 2 - a * 1.6; P.armR2.rotation.x = sw * 2 - a * 1.6; }
    if (P.legL) { P.legL.rotation.x = -sw * .4; P.legR.rotation.x = sw * .4; }
    P.spine.rotation.x = (o.hunch ?? 0) + j(Math.sin(t * 1.3 + P.phase)) * .03 + a * .25;
    if (o.jerky) P.head.rotation.z = Math.sin(t * 7 + P.phase) > .85 ? .45 : Math.sin(t * .8) * .1;
    if (o.float) P.inner.position.y = Math.sin(t * 1.5 + P.phase) * .2 + .3;
    if (o.weapon === 'blades' || (P.o.fourArms && a)) P.inner.rotation.y = a * Math.PI * 2;
  } else if (P.kind === 'q') {
    P.legs.forEach((l, i) => l.rotation.x = Math.sin(t * 2 + i * 1.6 + P.phase) * .08);
    P.tail.rotation.z = Math.sin(t * 3 + P.phase) * .3;
    P.head.rotation.x = Math.sin(t * 1.5 + P.phase) * .06 - a * .5;
    P.inner.position.z = a * 1.2; P.inner.position.y = a * .6;
  } else if (P.kind === 'b') {
    P.wings[0].rotation.y = .3 + Math.sin(t * 8 + P.phase) * .6; P.wings[1].rotation.y = -.3 - Math.sin(t * 8 + P.phase) * .6;
    P.inner.position.y = 2.2 + Math.sin(t * 2 + P.phase) * .2 - a * 1.2;
  } else {
    P.legs.forEach((l, i) => l.rotation.y = Math.sin(t * 6 + i) * .2);
    P.inner.position.z = a * .8;
  }
  if (P.lift !== undefined) P.root.children[0].position.y = P.lift + Math.sin(t * 1.6) * .15;
  if (P.spin) P.spin.rotation.y = t * 2;
  if (P.pulse) { const k = 1 + Math.sin(t * 4) * .06; P.pulse.scale.set(k, k, k); }
  for (const c of P.copies ?? []) animate(c, t + 1, false);
}

// ---------- Aufbau pro Theme ----------
let mobs = [], selected = 0, theme = 'wald';

function clearLabels() { labels.forEach(l => l.remove()); labels.length = 0; }

function showTheme(id) {
  theme = id; const T = THEMES[id];
  mobs.forEach(m => scene.remove(m.root)); mobs = []; clearLabels();
  scene.background = new THREE.Color(T.bg); scene.fog = new THREE.Fog(T.bg, T.fogN, T.fogF);
  ground.material.color.setHex(T.ground);
  hemi.color.setHex(T.hemi[0]); hemi.groundColor.setHex(T.hemi[1]); hemi.intensity = T.hemi[2]; sun.color.setHex(T.sun);
  let x = 0;
  const list = ORDER.filter(c => SKINS[id][c]);
  for (const cat of list) {
    const def = SKINS[id][cat], P = BUILD[def[1]](def[2]);
    P.cat = cat; P.name = def[0]; P.skinDef = def; P.phase = Math.random() * 6;
    const z = zusBy[id + cat] ?? 'none'; if (z !== 'none') addZusatz(P, z);
    x += P.width / 2 + .3; P.root.position.x = x; x += P.width / 2 + .3;
    scene.add(P.root); mobs.push(P);
    const l = document.createElement('div'); l.className = 'lbl'; l.innerHTML = `${def[0]}<small>${CATS[cat].name}</small>`; document.body.appendChild(l); labels.push(l);
  }
  const off = x / 2; mobs.forEach(m => m.root.position.x -= off);
  rowW = x;
  if (selected >= mobs.length) selected = 0;
  fitAll();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  renderSide();
}

function renderSide() {
  const P = mobs[selected]; if (!P) return;
  const C = CATS[P.cat], T = THEMES[theme], z = zusBy[theme + P.cat] ?? 'none';
  document.getElementById('side').innerHTML = `
    <h2>${P.name}</h2><div class="cat">${C.name} · ${T.name} (Schwierigkeit ${T.diff})</div>
    <table><tr><td>Leben</td><td>${C.hp}</td></tr><tr><td>Schaden</td><td>${C.dmg}</td></tr><tr><td>Tempo</td><td>${C.spd}</td></tr><tr><td>XP</td><td>${C.xp}</td></tr></table>
    <p>${C.text}</p>
    <div class="cat" style="margin:10px 0 0">Zusatz: ${ZUS[z].name}</div><p>${ZUS[z].text}</p>
    <div class="zus">${Object.entries(ZUS).map(([k, v]) => `<button data-z="${k}" class="${k === z ? 'on' : ''}">${v.name}</button>`).join('')}</div>`;
  document.querySelectorAll('.zus button').forEach(b => b.onclick = () => { zusBy[theme + P.cat] = b.dataset.z; showTheme(theme); focus(mobs[selected]); });
}

let down = null;
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(mobs.map(m => m.root), true)[0]; if (!hit) return;
  const i = mobs.findIndex(m => { let o = hit.object; while (o) { if (o === m.root) return true; o = o.parent; } return false; });
  if (i >= 0) { selected = i; renderSide(); focus(mobs[i]); }
});

function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', () => { resize(); fitAll(); }); resize();

const clock = new THREE.Clock(), v = new THREE.Vector3();
function loop() {
  const t = clock.getElapsedTime();
  mobs.forEach((m, i) => {
    animate(m, t, i === selected);
    v.set(m.root.position.x, m.height + (m.lift ?? 0) + .3 + (i % 2) * .7, m.root.position.z).project(camera);
    const l = labels[i]; l.style.left = (v.x * .5 + .5) * innerWidth + 'px'; l.style.top = (-v.y * .5 + .5) * innerHeight + 'px';
    l.style.display = v.z < 1 ? '' : 'none'; l.classList.toggle('sel', i === selected);
  });
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
}
showTheme('wald'); loop();
</script>
</body>
