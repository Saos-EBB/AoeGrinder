<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set-Skins Viewer – Krieger</title>
<style>
  :root { --bg: #0f0d13; --panel: #17141c; --line: #2a2533; --text: #ece8f2; --mute: #a49cb3; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Inter, system-ui, sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; display: block; }
  #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; background: linear-gradient(#0f0d13ee, #0f0d1300); }
  #bar h1 { margin: 0 12px 0 0; font-size: 20px; letter-spacing: .5px; }
  .grp { display: flex; gap: 6px; flex-wrap: wrap; }
  button, a.btn { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: 600 14px Inter, system-ui, sans-serif; cursor: pointer; display: inline-flex; align-items: center; text-decoration: none; }
  button[aria-pressed="true"] { background: var(--acc, #e8b23a); color: #0f0d13; border-color: var(--acc, #e8b23a); }
  #info { position: fixed; left: 16px; bottom: 16px; width: min(440px, calc(100vw - 32px)); padding: 14px 16px; background: #17141ce6; border: 1px solid var(--line); border-radius: 12px; }
  #info h2 { margin: 0 0 4px; font-size: 18px; }
  #info p { margin: 6px 0 0; font-size: 13.5px; color: #d9d2e4; }
  #info .mute { color: var(--mute); font-size: 12.5px; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  #labels div { position: absolute; transform: translate(-50%, 0); font-weight: 700; font-size: 14px; text-shadow: 0 1px 3px #000; white-space: nowrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="bar">
  <h1>Krieger-Skins</h1>
  <div class="grp" id="weps"></div>
  <div class="grp" id="skins"></div>
  <div class="grp">
    <button id="bAll" aria-pressed="true">Alle</button>
    <button id="bTon" aria-pressed="false">Ton</button>
    <button id="bRage" aria-pressed="false">Wut-Aura</button>
    <button id="bSpin" aria-pressed="true">Drehen</button>
    <a class="btn" href="index.html">← Magier-Sets</a>
  </div>
</div>
<div id="info"></div>
<div id="sliders" style="position:fixed;right:16px;bottom:16px;padding:12px 14px;background:#17141ce6;border:1px solid var(--line);border-radius:12px;min-width:260px">
  <label style="display:flex;justify-content:space-between;font-size:13px;color:var(--mute)">Kills im Run (Holzfäller) <span id="vK">120</span></label>
  <input id="sK" type="range" min="0" max="600" value="120" style="width:100%" aria-label="Kills">
  <div style="font-size:12px;color:var(--mute)">1 Kerbe pro Kill (max 40 sichtbar) · ab 100 goldener Stiel · ab 500 Sprössling · alle 20 Kills ein Scheit</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------- Daten: 3 Waffen × 3 Skins (Mockups, eigene Designs) ----------------
const WEPS = {
  schwert: { tab: 'Riesenschwert', css: '#ff5a3c', desc: 'Standard-Waffe: Klinge 1,9 m, Haken am Rücken, 3 Kerben, schräge Spitze, helle Schneide.' },
  leeroy:  { tab: 'Leeroys Klinge', css: '#ffc23a', desc: 'Legendär (WoW-Anspielung): rücksichtslos, rennt ins Pack, Hühnchen als Heilung.' },
  sion:    { tab: 'Sions Axt', css: '#9b7cff', desc: 'Legendär (LoL-Anspielung): Untoter Koloss, Seelenofen-Schild, Ansturm.' },
};
const SKINS = {
  schwert: [
    { id: 'schrott', name: 'Schrottsöldner', css: '#c98a4a', look: 'Flickwerk-Rüstung aus Blechplatten und Nieten, Schweißerbrille auf der Stirn, Kette um den Arm. Klinge: rostig, vernietete Flicken, Kette am Griff.' },
    { id: 'lava',    name: 'Vulkanschmied', css: '#ff6a1a', look: 'Schwarze Lederschürze, dicke Schmiedehandschuhe, Glut-Risse im Körper, Rauch vom Kopf. Klinge: schwarzer Stahl mit glühenden Adern, die Schneide glüht.' },
    { id: 'nomade',  name: 'Wüstennomade',  css: '#e2c48a', look: 'Sandfarbene Tücher, Schal vor dem Mund, nur die Augen frei, Wickel an Armen und Beinen. Klinge: in Bandagen gewickelt, nur Spitze und Schneide frei.' },
    { id: 'klapse',  name: 'Ausbrecher',    css: '#e8e4d8', look: 'Zwangsjacke, ein Ärmel aufgerissen, Gurte baumeln, Krankenhaus-Hose, Schlappen, wirre Haare, Pflaster auf der Stirn, weit aufgerissene Augen. Waffe: Brechstange statt Schwert. Gag: er hört Stimmen (Flüster-Blasen um den Kopf, Taste „Ton“).' },
  ],
  leeroy: [
    { id: 'hahn',    name: 'Hühnerpaladin', css: '#ffd25a', look: 'Glänzende Blech-Rüstung, Helm mit rotem Hahnenkamm, Hähnchenkeule am Gürtel. Klinge: Gold, Parierstange mit Flügeln, Feder am Knauf.' },
    { id: 'grill',   name: 'Grillmeister',  css: '#ff8a5a', look: 'Schürze mit Flammen-Rand, Kochmütze, Zange am Gürtel. Klinge: Hackbeil-Form mit Grillmuster, eine Wurst hängt am Haken.' },
    { id: 'sprint',  name: 'Pack-Sprinter', css: '#5ad7ff', look: 'Laufshirt, kurze Hose, Schweißband an Stirn und Handgelenk, grelle Laufschuhe. Klinge: schlank, Tempo-Streifen, Wind-Fahne.' },
    { id: 'classic', name: 'Classic-Krieger 55', css: '#ffb03a', look: 'Look wie ein Classic-Krieger auf Stufe ~55 im „Clownsuit“: jedes Teil aus einem anderen Dungeon, nichts passt. Riesige rote Dorn-Schultern, lila Brustplatte, knallgelbe Stulpen mit pinkem Saum, brauner Gürtel mit Riesenschnalle, grüne Beinplatten, blaue Klotz-Stiefel, türkiser Umhang, grauer Helm mit Bronze-Hörnern. Low-Poly, flache Schattierung. Waffe: klobiger Zweihänder mit rotem Verzauberungs-Glühen. Gag: Leeroy-Rufe als Sprechblasen, Taste „Ton“ ruft laut.' },
  ],
  sion: [
    { id: 'grab',    name: 'Grabkoloss',    css: '#b6e07a', look: 'Graugrüne Haut mit Nähten, Knochen-Schulterplatten, ein glühendes Auge, Kiefer-Gitter. Axt: Knochenstiel, schartige Rost-Klinge.' },
    { id: 'ofen',    name: 'Seelenofen',    css: '#ff7a3a', look: 'Eiserner Brustofen mit Glut-Klappe, Schornstein-Dornen am Rücken, Funken. Axt: Gusseisen, Schneide glüht, Kohle im Kopf.' },
    { id: 'frost',   name: 'Eisgrab',       css: '#9fe4ff', look: 'Gefrorener Untoter: blasse Rüstung mit Raureif, Eiszapfen am Kinn, blaue Augen. Axt: Eisblock-Klinge, kalter Dunst.' },
    { id: 'holz',    name: 'Holzfäller',    css: '#d9372b', look: 'Rot-schwarz kariertes Holzfällerhemd, Ärmel hochgekrempelt, Hosenträger, Jeans mit Umschlag, Arbeitsstiefel, Strickmütze mit Bommel, Vollbart. Axt: saubere Fällaxt, heller Holzstiel, Stahlkopf mit polierter Schneide. Gag 1: jeder Kill eine Kerbe im Stiel, ab 100 Kills goldener Stiel, ab 500 ein Sprössling. Gag 4: Holzstapel auf dem Rücken, alle 20 Kills ein Scheit (Regler unten rechts).' },
  ],
};
const S = { wep: 'schwert', skin: 0, all: true, rage: false, spin: true, kills: 120 };

// ---------------- Szene ----------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0f0d13);
const cam = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
const ctl = new OrbitControls(cam, canvas); ctl.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x2a2030, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2.5, 4, 3); scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(8, 48), new THREE.MeshToonMaterial({ color: 0x1d1924 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

// ---------------- Material (wie Magier-Sets) ----------------
const ramp = (() => { const d = new Uint8Array([70, 70, 70, 255, 160, 160, 160, 255, 255, 255, 255, 255]); const t = new THREE.DataTexture(d, 3, 1); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const cache = {};
const toon = (c, o = {}) => { const k = c + JSON.stringify(o); return cache[k] ||= new THREE.MeshToonMaterial({ color: c, gradientMap: ramp, ...o }); };
const glow = c => cache['g' + c] ||= new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(1.3) });
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x0a0806, side: THREE.BackSide });
outlineMat.onBeforeCompile = sh => { sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\ntransformed += normal * 0.014;'); };
function addOutlines(root) {
  const list = []; root.traverse(o => { if (o.isMesh && o.material.isMeshToonMaterial && !o.material.transparent && !o.userData.noOutline) list.push(o); });
  for (const m of list) m.add(new THREE.Mesh(m.geometry, outlineMat));
}
function canvasTex(draw, w = 64, h = 64) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
const dotTex = canvasTex((g, w) => { const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2); r.addColorStop(0, '#fff'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, w); });
const sprite = (col, size) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, color: col, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); s.scale.setScalar(size); return s; };

// ---------------- Geometrie-Helfer ----------------
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function mesh(geo, mat, parent, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; }
function seg(a, b, r1, r2, mat, parent, joint = true) {
  const d = b.clone().sub(a), len = d.length();
  const m = mesh(new THREE.CylinderGeometry(r2, r1, len, 14), mat, parent);
  m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize());
  if (joint) mesh(new THREE.SphereGeometry(r1, 14, 10), mat, parent).position.copy(a);
  return m;
}
function torso(parent, mat, yTop, yBot, rTop, rBot, depth = 0.6) {
  const m = mesh(new THREE.CylinderGeometry(rTop, rBot, yTop - yBot, 20), mat, parent, 0, (yTop + yBot) / 2, 0); m.scale.z = depth;
  const cap = mesh(new THREE.SphereGeometry(rTop, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), mat, parent, 0, yTop, 0); cap.scale.set(1, 0.3, depth);
  return m;
}
function ring(parent, mat, pos, r, t, dir) { const m = mesh(new THREE.TorusGeometry(r, t, 6, 16), mat, parent); m.position.copy(pos); m.quaternion.setFromUnitVectors(V(0, 0, 1), dir.clone().normalize()); return m; }
function extrude(pts, depth, mat, parent) {
  const sh = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
  const g = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: false }); g.translate(0, 0, -depth / 2); g.computeVertexNormals();
  return mesh(g, mat, parent);
}

// ---------------- Krieger-Körper (Manga-Regeln, aber schwer: 2,0 m, Schultern ~2,4 Köpfe, Keil-Torso) ----------------
const P = {
  head: V(0, 1.84, 0),
  shL: V(-0.27, 1.56, 0), elL: V(-0.36, 1.24, -0.02), wrL: V(-0.36, 0.98, 0.03), haL: V(-0.36, 0.91, 0.04),
  shR: V(0.27, 1.56, 0), elR: V(0.4, 1.28, 0.08), wrR: V(0.3, 1.4, 0.24), haR: V(0.29, 1.44, 0.27),
  hipL: V(-0.095, 0.95, 0), knL: V(-0.115, 0.53, 0.03), anL: V(-0.13, 0.09, 0),
  hipR: V(0.095, 0.95, 0), knR: V(0.115, 0.53, 0.03), anR: V(0.13, 0.09, 0),
};

function body(F, k) {   // k: { top, sleeve, pants, shoe, skin, torsoR }
  const B = new THREE.Group(); F.add(B);
  const armL = new THREE.Group(), armR = new THREE.Group(); B.add(armL, armR);
  const head = new THREE.Group(); head.position.copy(P.head); B.add(head);
  seg(V(0, 1.62, 0), V(0, 1.74, 0), 0.075, 0.065, k.skin, B, false);
  torso(B, k.top, 1.62, 1.08, k.torsoR ?? 0.3, 0.18, 0.6);
  // Becken nach Manga-Regel: ein Eimer, so breit wie der Brustkorb unten, senkrecht darunter (Mann: Hüfte nicht breiter als Brust)
  const hm = k.hips ?? k.pants;
  const pelvis = mesh(new THREE.CylinderGeometry(0.18, 0.2, 0.13, 20), hm, B, 0, 1.015, 0); pelvis.scale.z = 0.68;
  const crotch = mesh(new THREE.SphereGeometry(0.2, 20, 10, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), hm, B, 0, 0.951, 0); crotch.scale.set(1, 0.42, 0.68);
  for (const [arm, sh, el, wr, ha] of [[armL, P.shL, P.elL, P.wrL, P.haL], [armR, P.shR, P.elR, P.wrR, P.haR]]) {
    mesh(new THREE.SphereGeometry(0.1, 14, 10), k.sleeve, arm).position.copy(sh);
    seg(sh, el, 0.085, 0.07, k.sleeve, arm, false); seg(el, wr, 0.07, 0.058, k.sleeve, arm);
    const h = mesh(new THREE.SphereGeometry(0.068, 12, 8), k.hand ?? k.skin, arm); h.position.copy(ha);   // große Fäuste
  }
  for (const [hip, kn, an] of [[P.hipL, P.knL, P.anL], [P.hipR, P.knR, P.anR]]) {
    seg(hip, kn, 0.105, 0.078, k.pants, B, false); mesh(new THREE.SphereGeometry(0.104, 14, 10), k.pants, B).position.copy(hip); seg(kn, an, 0.08, 0.06, k.pants, B);
    mesh(new THREE.BoxGeometry(0.13, 0.09, 0.28), k.shoe, B, an.x, 0.045, 0.05);
  }
  const skull = mesh(new THREE.SphereGeometry(0.12, 22, 16), k.skin, head); skull.scale.set(0.92, 1.08, 0.95);   // kleiner Kopf
  return { B, armL, armR, head, skull };
}
const eyes = (head, c, w = 0.03, h = 0.02, y = -0.005) => { for (const x of [-0.042, 0.042]) { const e = mesh(new THREE.SphereGeometry(1, 10, 8), c, head, x, y, 0.105); e.scale.set(w / 2, h / 2, 0.01); e.userData.noOutline = true; } };   // böse, schmale Augen
const brow = (head, c) => { for (const s of [-1, 1]) { const b = mesh(new THREE.BoxGeometry(0.05, 0.012, 0.01), c, head, s * 0.042, 0.018, 0.108); b.rotation.z = s * -0.35; } };

// ---------------- Waffen ----------------
// Alle Waffen entlang +Y gebaut, Ursprung = rechte Faust. Getragen über der Schulter (Ruhe-Pose).
function carry(W, parent) { const g = new THREE.Group(); g.position.copy(P.haR); g.quaternion.setFromUnitVectors(V(0, 1, 0), V(-0.25, 0.55, -0.8).normalize()); g.add(W); parent.add(g); return g; }

function riesenschwert(v, fx) {
  const W = new THREE.Group();
  const bladeMat = { schrott: toon(0x8a7a6a), lava: toon(0x1e1a1c), nomade: toon(0xb8b2a8) }[v];
  const edgeMat = { schrott: toon(0xd8d2c8), lava: glow(0xff6a1a), nomade: toon(0xf2f2f2) }[v];
  const grip = mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.44, 10), toon(0x2a1a12), W, 0, -0.04, 0);
  mesh(new THREE.SphereGeometry(0.055, 10, 8), toon(0x5a4a3a), W, 0, -0.28, 0);
  mesh(new THREE.BoxGeometry(0.46, 0.07, 0.11), toon(0x3a3238), W, 0, 0.2, 0);
  // Klinge: 1,9 m, 36 cm breit, schräge Spitze, Haken am Rücken, 3 Kerben
  const y0 = 0.24, y1 = 2.14, w = 0.18;
  const pts = [[w, y0], [w, y1], [-w, y1 - 0.2], [-w, y1 - 0.42], [-w - 0.09, y1 - 0.48], [-w - 0.07, y1 - 0.56], [-w, y1 - 0.56]];
  for (const y of [1.25, 1.0, 0.75]) pts.push([-w, y + 0.06], [-w + 0.06, y], [-w, y - 0.06]);
  pts.push([-w, y0]);
  extrude(pts, 0.07, bladeMat, W);
  const edge = extrude([[w - 0.045, y0 + 0.05], [w, y0 + 0.05], [w, y1], [w - 0.045, y1 - 0.025]], 0.074, edgeMat, W);
  if (v === 'lava') edge.userData.noOutline = true;
  if (v === 'schrott') {   // vernietete Flicken + Kette am Griff
    for (const [x, y, sx, sy] of [[-0.04, 0.55, 0.16, 0.22], [0.05, 1.45, 0.14, 0.18]]) {
      mesh(new THREE.BoxGeometry(sx, sy, 0.09), toon(0x6a5040), W, x, y, 0);
      for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) mesh(new THREE.SphereGeometry(0.012, 6, 4), toon(0xd8c8a0), W, x + dx * (sx / 2 - 0.02), y + dy * (sy / 2 - 0.02), 0.05);
    }
    for (let i = 0; i < 6; i++) { const r = mesh(new THREE.TorusGeometry(0.025, 0.007, 4, 10), toon(0x9a9aa2), W, 0.05, -0.3 - i * 0.04, 0); r.rotation.y = i % 2 ? Math.PI / 2 : 0; }
  }
  if (v === 'lava') {      // glühende Adern + Funken
    const veins = [[[-0.1, 0.35], [0.02, 0.7], [-0.06, 1.1], [0.05, 1.5], [-0.04, 1.85]], [[0.08, 0.5], [-0.02, 0.9], [0.06, 1.3]]];
    for (const vv of veins) { const c = new THREE.CatmullRomCurve3(vv.map(([x, y]) => V(x, y, 0.037))); const t = mesh(new THREE.TubeGeometry(c, 30, 0.009, 4), glow(0xff7a0d), W); t.userData.noOutline = true; const t2 = t.clone(); t2.position.z = -0.074; W.add(t2); }
    const sp = new THREE.Group(); W.add(sp);
    for (let i = 0; i < 8; i++) { const s = sprite(i % 2 ? 0xffb03a : 0xff5a1a, 0.08); s.userData.p = Math.random(); sp.add(s); }
    fx(t => sp.children.forEach(s => { const k = (s.userData.p + t * 0.4) % 1; s.position.set(0.16 + k * 0.1, 0.4 + s.userData.p * 1.6, Math.sin(t * 3 + s.userData.p * 9) * 0.05); s.material.opacity = 1 - k; }));
  }
  if (v === 'nomade') {    // Bandagen-Wicklung, Schneide + Spitze frei
    const wrap = toon(0xd8c49a);
    for (let i = 0; i < 9; i++) { const b = mesh(new THREE.BoxGeometry(0.3, 0.06, 0.085), wrap, W, -0.03, 0.35 + i * 0.15, 0); b.rotation.z = 0.25; }
    const tail = mesh(new THREE.PlaneGeometry(0.06, 0.5), toon(0xd8c49a, { side: THREE.DoubleSide }), W, -0.2, 1.4, 0); tail.userData.noOutline = true;
    fx(t => { tail.rotation.y = Math.sin(t * 2) * 0.6; tail.rotation.z = 0.4 + Math.sin(t * 1.7) * 0.15; });
  }
  return W;
}

function leeroyKlinge(v, fx) {
  const W = new THREE.Group();
  if (v === 'hahn') {      // Gold-Langschwert, Flügel-Parierstange, Feder am Knauf
    mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.34, 10), toon(0x6a2a1a), W, 0, 0, 0);
    mesh(new THREE.SphereGeometry(0.045, 10, 8), toon(0xe8b23a), W, 0, -0.2, 0);
    for (const s of [-1, 1]) { const wing = extrude([[0, 0], [s * 0.3, 0.12], [s * 0.26, 0.04], [s * 0.2, 0.07], [s * 0.16, 0.0], [s * 0.1, 0.04]], 0.04, toon(0xf2d27a), W); wing.position.y = 0.16; }
    extrude([[0.07, 0.2], [0.07, 1.35], [0, 1.52], [-0.07, 1.35], [-0.07, 0.2]], 0.04, toon(0xe8b23a), W);
    mesh(new THREE.BoxGeometry(0.02, 1.15, 0.045), toon(0xfff2c0), W, 0, 0.8, 0);
    const fe = mesh(new THREE.ConeGeometry(0.05, 0.3, 6), toon(0xd9372b), W, 0.04, -0.36, 0); fe.rotation.z = 2.6; fe.scale.z = 0.3;
    fx(t => { fe.rotation.x = Math.sin(t * 4) * 0.25; });
  }
  if (v === 'grill') {     // Hackbeil-Klinge mit Grillmuster, Wurst am Haken
    mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.38, 10), toon(0x3a2418), W, 0, 0, 0);
    mesh(new THREE.BoxGeometry(0.12, 0.05, 0.07), toon(0x8a8a92), W, 0, 0.2, 0);
    extrude([[-0.05, 0.22], [0.36, 0.22], [0.36, 1.2], [0.06, 1.28], [-0.05, 1.2]], 0.05, toon(0xb8bcc4), W);
    for (let i = 0; i < 6; i++) { const l = mesh(new THREE.BoxGeometry(0.34, 0.018, 0.054), toon(0x2a2224), W, 0.15, 0.32 + i * 0.15, 0); l.rotation.z = 0.5; }

function bubbleTex(txt, loud) {

    let fs = loud ? 64 : 42; const set = () => g.font = (loud ? '900 ' : 'italic 600 ') + fs + 'px Inter, system-ui, sans-serif'; set();
    while (g.measureText(txt).width > w - 90 && fs > 20) { fs -= 2; set(); }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const tw = Math.min(w - 20, g.measureText(txt).width + 50);
    g.fillStyle = loud ? '#fff2c0' : 'rgba(230,226,240,0.85)'; g.strokeStyle = '#1a1420'; g.lineWidth = 6;
    g.beginPath(); g.roundRect((w - tw) / 2, 20, tw, h - 60, 30); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(w / 2 - 20, h - 42); g.lineTo(w / 2, h - 8); g.lineTo(w / 2 + 20, h - 42); g.fill(); g.stroke();
    g.fillStyle = loud ? '#b8200a' : '#3a3448'; g.fillText(txt, w / 2, (h - 20) / 2);
  }, 640, 160);
}

    mesh(new THREE.SphereGeometry(0.045, 10, 8), toon(0xf2ece0), hat, 0, 0.155, 0);
    eyes(head, toon(0x15121a), 0.024, 0.022, 0.0); brow(head, toon(0x6a3a1a));
    const beard = mesh(new THREE.SphereGeometry(0.11, 14, 10), toon(0x7a3a1a), head, 0, -0.1, 0.045); beard.scale.set(1, 0.7, 0.85);   // Vollbart
    mesh(new THREE.BoxGeometry(0.1, 0.02, 0.02), toon(0x7a3a1a), head, 0, -0.035, 0.11);
    carry(faellAxt(S.kills), armR);
    // Gag 4: Holzstapel auf dem Rücken (Kraxe), alle 20 Kills ein Scheit, max 15. Im Spiel: ein Bone, der skaliert wird.
    const kr = new THREE.Group(); kr.position.set(0, 1.25, -0.2); B.add(kr);
    for (const x of [-0.17, 0.17]) seg(V(x, -0.3, -0.02), V(x, 0.45, -0.02), 0.014, 0.014, toon(0x5a3a20), kr, false);
    mesh(new THREE.BoxGeometry(0.38, 0.03, 0.18), toon(0x5a3a20), kr, 0, -0.3, -0.1);
    const logs = Math.min(15, Math.floor(S.kills / 20));
    for (let i = 0; i < logs; i++) { const row = Math.floor(i / 3), col = i % 3;
      const lg = mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.4, 10), toon(0x8a5a32), kr, 0, -0.24 + row * 0.1, -0.06 - col * 0.1 + (row % 2) * 0.03); lg.rotation.z = Math.PI / 2;
      for (const s of [-1, 1]) { const end = mesh(new THREE.CircleGeometry(0.05, 10), toon(0xe8c890), lg, 0, s * 0.201, 0); end.rotation.x = s * -Math.PI / 2; } }
  }
  // Wut-Aura (wie Strichkrieger: rote Hülle wächst mit Wut)
  if (S.rage) {
    const aura = new THREE.Group(); F.add(aura);
    for (let i = 0; i < 18; i++) { const s = sprite(i % 3 ? 0xff2a1a : 0xff8a3a, 0.35); s.userData = { p: Math.random(), a: Math.random() * 6.28 }; aura.add(s); }
    fx(t => aura.children.forEach(s => { const k = (s.userData.p + t * 0.35) % 1; s.position.set(Math.cos(s.userData.a + t) * 0.4, 0.1 + k * 2.1, Math.sin(s.userData.a + t) * 0.3); s.material.opacity = 0.45 * Math.sin(k * Math.PI); }));
  }
  addOutlines(F);
  F.userData = { body: R.B, fx: fxList, idx };
  return F;
}

// ---------------- Aufbau + UI ----------------
let figs = [];
function rebuild() {
  figs.forEach(f => scene.remove(f)); figs = [];
  const list = S.all ? SKINS[S.wep].map((_, i) => i) : [S.skin];
  list.forEach((i, n) => { const f = buildFigure(S.wep, i); f.position.x = S.all ? (n - (list.length - 1) / 2) * 2.0 : 0; scene.add(f); figs.push(f); });
  cam.position.set(S.all ? 0 : 2.8, S.all ? 2.4 : 1.9, S.all ? 8.8 : 5.4); ctl.target.set(0, 1.35, 0);
  ui();
}
const $ = id => document.getElementById(id);
Object.keys(WEPS).forEach(id => { const b = document.createElement('button'); b.textContent = WEPS[id].tab; b.dataset.id = id; b.style.setProperty('--acc', WEPS[id].css); b.onclick = () => { S.wep = id; S.skin = 0; rebuild(); }; $('weps').append(b); });
for (let i = 0; i < 4; i++) { const b = document.createElement('button'); b.dataset.i = i; b.onclick = () => { S.skin = i; S.all = false; rebuild(); }; $('skins').append(b); }
$('bAll').onclick = () => { S.all = !S.all; rebuild(); };
// Ton: Leeroy ruft laut, Ausbrecher hört Flüstern (Browser-Sprachausgabe, nur nach Klick)
$('bTon').onclick = () => {
  try {
    const say = (txt, o) => { const u = new SpeechSynthesisUtterance(txt); Object.assign(u, o); speechSynthesis.speak(u); };
    speechSynthesis.cancel();
    if (S.wep === 'leeroy') { say('Leeeeeroooooy Jenkins!', { lang: 'en-US', rate: 0.8, pitch: 1.1, volume: 1 }); say('At least I have chicken.', { lang: 'en-US', rate: 1 }); }
    else if (S.wep === 'schwert') ['psst', 'hinter dir', 'links', 'zähl die Mobs', 'jetzt'].forEach(w => say(w, { lang: 'de-DE', rate: 0.7, pitch: 0.3, volume: 0.35 }));
  } catch (e) {}
};
$('sK').oninput = e => { S.kills = +e.target.value; rebuild(); };
$('bRage').onclick = () => { S.rage = !S.rage; rebuild(); };
$('bSpin').onclick = () => { S.spin = !S.spin; ui(); };
function ui() {
  $('sliders').style.display = S.wep === 'sion' ? 'block' : 'none'; $('vK').textContent = S.kills;
  $('weps').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === S.wep)));
  $('skins').querySelectorAll('button').forEach(b => { const s = SKINS[S.wep][+b.dataset.i]; b.textContent = s.name; b.style.setProperty('--acc', s.css); b.setAttribute('aria-pressed', String(!S.all && +b.dataset.i === S.skin)); });
  $('bAll').setAttribute('aria-pressed', String(S.all)); $('bTon').disabled = S.wep === 'sion'; $('bTon').style.opacity = S.wep === 'sion' ? 0.45 : 1; $('bRage').setAttribute('aria-pressed', String(S.rage)); $('bSpin').setAttribute('aria-pressed', String(S.spin));
  const w = WEPS[S.wep], s = SKINS[S.wep][S.skin];
  $('info').innerHTML = S.all
    ? '<h2 style="color:' + w.css + '">' + w.tab + ': ' + SKINS[S.wep].length + ' Skins</h2><p class="mute">' + w.desc + '</p><p class="mute">Mockups, eigene Designs. Skin anklicken für Details.</p>'
    : '<h2 style="color:' + s.css + '">' + s.name + '</h2><div class="mute">' + w.tab + '</div><p>' + s.look + '</p>';
}
const labels = $('labels');
function drawLabels() {
  labels.innerHTML = ''; if (!S.all) return;
  figs.forEach(f => { const s = SKINS[S.wep][f.userData.idx], p = f.position.clone().add(V(0, 2.75, 0)).project(cam); const d = document.createElement('div'); d.textContent = s.name; d.style.color = s.css; d.style.left = ((p.x + 1) / 2 * innerWidth) + 'px'; d.style.top = ((1 - p.y) / 2 * innerHeight) + 'px'; labels.append(d); });
}
function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  figs.forEach(f => { if (S.spin) f.rotation.y = Math.sin(t * 0.35) * 0.9; f.userData.body.position.y = Math.sin(t * 2) * 0.008; f.userData.fx.forEach(fn => fn(t)); });
  ctl.update(); renderer.render(scene, cam); drawLabels();
});
window.__set = o => { Object.assign(S, o); rebuild(); };
rebuild();
</script>
