<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frost Grind – VFX-Labor</title>
<style>
  :root { --bg: #10141c; --panel: #151a24e6; --line: #3a4356; --text: #e6ecf5; --dim: #9aa6ba; --accent: #7fd0ff; --on: #1d3a52; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #10141c; } }
  :root[data-theme="dark"] { --bg: #10141c; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.35 system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #panel { position: fixed; left: 8px; top: 8px; bottom: 8px; width: 236px; max-width: calc(100vw - 32px); padding: 10px; box-sizing: border-box;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-y: auto; z-index: 5; }
  #panel.closed { bottom: auto; width: auto; }
  #panel.closed > :not(#toggle) { display: none; }
  #toggle { width: auto; margin: 0 0 6px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  h2 { font-size: 11px; margin: 10px 0 4px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  button, select { font: inherit; color: var(--text); background: #222a38; border: 1px solid var(--line); border-radius: 5px; padding: 5px 6px; cursor: pointer; min-height: 30px; }
  select { width: 100%; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--on); border-color: var(--accent); }
  .lbl { display: block; margin: 6px 0 3px; color: var(--dim); }
  .wide { width: 100%; margin-top: 4px; }
  #stats { position: fixed; right: 8px; top: 8px; padding: 6px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    font-variant-numeric: tabular-nums; text-align: right; z-index: 5; pointer-events: none; }
  #overlay { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .plate { display: none; }
  .ct { position: absolute; font-weight: 800; text-shadow: 0 1px 2px #000, 0 0 3px #000; animation: ctUp 1.2s ease-out forwards; }
  .ct.dmg { color: #fff; font-size: 16px; } .ct.crit { color: #ffe14d; font-size: 26px; } .ct.miss { color: #c8c8c8; font-size: 13px; }
  .ct.heal { color: #5dff7a; font-size: 15px; } .ct.hurt, .ct.xp, .ct.info { display: none; }
  @keyframes ctUp { to { transform: translateY(-46px); opacity: 0; } }
</style>
<script>
  // Das Labor nutzt den echten Spell-Code. Dessen Module greifen beim Laden auf das Spiel-Menü zu, das es hier nicht gibt: fehlende Elemente entstehen unsichtbar.
  (() => {
    const get = document.getElementById.bind(document);
    document.getElementById = id => {
      const found = get(id);
      if (found) return found;
      const el = document.createElement('div');
      el.id = id;
      get('hiddenDom').appendChild(el);
      return el;
    };
  })();
</script>
</head>
<body>
<div id="hiddenDom" hidden><div id="bindModal"><div class="row2"></div></div><div id="deathModal"><h1></h1></div></div>
<div id="overlay"></div>
<div id="stats"></div>
<div id="panel">
  <button id="toggle">Menü</button>
  <h1>VFX-Labor</h1>
  <h2>Optik</h2>
  <div class="grid"><button id="modeOld">Alt</button><button id="modeNew">Neu</button></div>
  <label for="quality" class="lbl">Effektqualität</label><select id="quality"><option value="niedrig">Niedrig</option><option value="mittel">Mittel</option><option value="hoch">Hoch</option></select>
  <button class="wide" id="slow">Zeitlupe 0,25×: aus</button>
  <h2>Start-Kit</h2><div class="grid" id="kit"></div>
  <h2>Neue Spells</h2><div class="grid" id="fresh"></div>
  <h2>Relikte</h2><div class="grid" id="relics"></div>
  <h2 id="runeHead">Rune</h2><select id="runeSel"></select>
  <h2>Test</h2>
  <button class="wide" id="stress">Last: 50 Sprünge + Blizzard</button>
  <button class="wide" id="stop">Alles stoppen</button>
</div>
<script type="module" src="/src/vfxLab.ts"></script>
</body>
</html>
